<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Runner - 霓虹跑酷</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: white; height: 100vh; }
        canvas { border: 2px solid #00d2ff; background: #111; box-shadow: 0 0 20px #00d2ff; }
        h2 { margin-bottom: 10px; color: #00d2ff; text-shadow: 0 0 10px blue; }
        p { color: #aaa; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>🏃‍♂️ Neon Runner</h2>
    <p>按空白鍵 (Space) 跳躍，避開紅色障礙物</p>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <br>
    <a href="index.html" style="color:white; text-decoration:none; margin-top:20px;">⬅ 回到首頁</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲變數
        let player = { x: 50, y: 300, w: 30, h: 50, dy: 0, jumpPower: -15, grounded: true };
        let obstacles = [];
        let frame = 0;
        let score = 0;
        let speed = 6;
        let isGameOver = false;

        function drawPlayer() {
            ctx.fillStyle = '#00d2ff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00d2ff';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.shadowBlur = 0;
        }

        function createObstacle() {
            // 隨機高度和寬度
            let h = 40 + Math.random() * 40;
            obstacles.push({ x: canvas.width, y: 400 - h, w: 30, h: h, passed: false });
        }

        function update() {
            if (isGameOver) {
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.fillText("Game Over!", 300, 200);
                ctx.font = "20px Arial";
                ctx.fillText("按 F5 或重新整理再來一次", 280, 240);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地板
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 390, canvas.width, 10);

            // 玩家物理 (重力)
            player.y += player.dy;
            if (player.y + player.h < 390) {
                player.dy += 0.8; // 重力
                player.grounded = false;
            } else {
                player.y = 390 - player.h;
                player.dy = 0;
                player.grounded = true;
            }

            drawPlayer();

            // 障礙物管理
            if (frame % 90 === 0) { // 每 90 幀產生一個
                createObstacle();
                speed += 0.1; // 越跑越快
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= speed;

                // 繪製障礙物
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'red';
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.shadowBlur = 0;

                // 碰撞偵測
                if (player.x < obs.x + obs.w &&
                    player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.h + player.y > obs.y) {
                    isGameOver = true;
                }

                // 移除超出畫面的障礙物並加分
                if (obs.x + obs.w < 0) {
                    obstacles.shift();
                    score++;
                    i--;
                }
            }

            // 分數
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 10, 30);

            frame++;
            requestAnimationFrame(update);
        }

        // 跳躍控制
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && player.grounded) {
                player.dy = player.jumpPower;
            }
        });
        window.addEventListener('touchstart', () => {
            if (player.grounded) player.dy = player.jumpPower;
        });

        update();
    </script>
</body>
</html>
