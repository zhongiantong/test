<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stress Buster - 發洩模擬器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: 'Roboto', sans-serif;
            color: white;
            user-select: none;
        }

        /* UI 面板 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 讓點擊穿透到 canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Black Ops One', cursive;
            color: #ff3d00;
            text-shadow: 2px 2px 0 #000;
            margin: 0;
            font-size: 40px;
            pointer-events: auto;
        }

        /* 工具列 */
        .toolbar {
            display: flex;
            gap: 10px;
            pointer-events: auto;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 15px;
            align-self: center;
        }

        .tool-btn {
            background: #444;
            border: 2px solid #666;
            color: white;
            width: 50px; height: 50px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .tool-btn:hover { transform: scale(1.1); background: #555; }
        .tool-btn.active { background: #ff3d00; border-color: #ff9e80; box-shadow: 0 0 15px #ff3d00; }

        /* 訂製面板 */
        .custom-panel {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            position: absolute;
            top: 80px; left: 20px;
            width: 200px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .custom-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #ffeb3b; }
        
        .setting-row { margin-bottom: 10px; }
        .setting-row label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc;}
        input[type="color"] { width: 100%; border: none; height: 30px; cursor: pointer; }
        select { width: 100%; padding: 5px; background: #333; color: white; border: 1px solid #555; }

        .btn-reset {
            width: 100%; background: #d32f2f; color: white; border: none; padding: 8px;
            margin-top: 10px; cursor: pointer; border-radius: 5px; font-weight: bold;
        }

        /* 返回按鈕 */
        .back-link {
            position: absolute; top: 20px; right: 20px;
            color: #aaa; text-decoration: none; pointer-events: auto;
            font-weight: bold;
        }

        /* 提示文字 */
        #hint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px; color: rgba(255,255,255,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div>
            <h1>STRESS BUSTER</h1>
            <a href="index.html" class="back-link">⬅ 回首頁</a>
        </div>
        
        <div class="custom-panel">
            <h3>📝 訂製討厭鬼</h3>
            <div class="setting-row">
                <label>皮膚顏色</label>
                <input type="color" id="skin-color" value="#f1c27d">
            </div>
            <div class="setting-row">
                <label>衣服顏色</label>
                <input type="color" id="shirt-color" value="#ffffff">
            </div>
            <div class="setting-row">
                <label>褲子顏色</label>
                <input type="color" id="pants-color" value="#333333">
            </div>
            <button class="btn-reset" onclick="resetRagdoll()">🔄 重置角色</button>
        </div>

        <div id="hint">選擇工具開始發洩</div>

        <div class="toolbar">
            <button class="tool-btn active" onclick="setTool('drag')" title="抓取 (神之手)">✋</button>
            <button class="tool-btn" onclick="setTool('punch')" title="重拳">🥊</button>
            <button class="tool-btn" onclick="setTool('bat')" title="球棒 (擊飛)">🏏</button>
            <button class="tool-btn" onclick="setTool('bomb')" title="炸彈">💣</button>
            <button class="tool-btn" onclick="setTool('zerog')" title="無重力">🌌</button>
        </div>
    </div>

    <script>
        // --- Matter.js 初始化 ---
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Composites = Matter.Composites,
              Constraint = Matter.Constraint,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events,
              Body = Matter.Body,
              Vector = Matter.Vector;

        // 建立引擎
        const engine = Engine.create();
        const world = engine.world;

        // 建立渲染器
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false, // 開啟實體顏色
                background: '#222'
            }
        });

        // 邊界牆壁
        const walls = [
            Bodies.rectangle(window.innerWidth/2, window.innerHeight+50, window.innerWidth, 100, { isStatic: true, render: {fillStyle: '#444'} }), // 地板
            Bodies.rectangle(window.innerWidth/2, -50, window.innerWidth, 100, { isStatic: true }), // 天花板
            Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true }), // 左牆
            Bodies.rectangle(window.innerWidth+50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true }) // 右牆
        ];
        Composite.add(world, walls);

        // --- 布娃娃系統 (Ragdoll) ---
        let ragdoll;
        let settings = {
            skin: '#f1c27d',
            shirt: '#ffffff',
            pants: '#333333'
        };

        function createRagdoll(x, y, scale) {
            const group = Body.nextGroup(true); // 讓身體部件之間不碰撞
            
            // 定義身體部件 (頭, 胸, 腰, 手, 腳)
            const head = Bodies.circle(x, y - 25 * scale, 15 * scale, { 
                collisionFilter: { group: group },
                render: { fillStyle: settings.skin },
                label: 'Head'
            });
            
            const chest = Bodies.rectangle(x, y, 30 * scale, 40 * scale, { 
                collisionFilter: { group: group },
                chamfer: { radius: 10 },
                render: { fillStyle: settings.shirt },
                label: 'Chest'
            });

            const leftArm = Bodies.rectangle(x - 20 * scale, y, 10 * scale, 35 * scale, { 
                collisionFilter: { group: group },
                chamfer: { radius: 5 },
                render: { fillStyle: settings.skin }
            });

            const rightArm = Bodies.rectangle(x + 20 * scale, y, 10 * scale, 35 * scale, { 
                collisionFilter: { group: group },
                chamfer: { radius: 5 },
                render: { fillStyle: settings.skin }
            });

            const leftLeg = Bodies.rectangle(x - 10 * scale, y + 40 * scale, 12 * scale, 45 * scale, { 
                collisionFilter: { group: group },
                chamfer: { radius: 5 },
                render: { fillStyle: settings.pants }
            });

            const rightLeg = Bodies.rectangle(x + 10 * scale, y + 40 * scale, 12 * scale, 45 * scale, { 
                collisionFilter: { group: group },
                chamfer: { radius: 5 },
                render: { fillStyle: settings.pants }
            });

            // 連接關節
            const headChest = Constraint.create({
                bodyA: head, bodyB: chest,
                pointA: { x: 0, y: 15 * scale }, pointB: { x: 0, y: -20 * scale },
                stiffness: 0.6, render: { visible: false }
            });

            const chestLeftArm = Constraint.create({
                bodyA: chest, bodyB: leftArm,
                pointA: { x: -15 * scale, y: -15 * scale }, pointB: { x: 0, y: -15 * scale },
                stiffness: 0.6, render: { visible: false }
            });

            const chestRightArm = Constraint.create({
                bodyA: chest, bodyB: rightArm,
                pointA: { x: 15 * scale, y: -15 * scale }, pointB: { x: 0, y: -15 * scale },
                stiffness: 0.6, render: { visible: false }
            });

            const chestLeftLeg = Constraint.create({
                bodyA: chest, bodyB: leftLeg,
                pointA: { x: -10 * scale, y: 20 * scale }, pointB: { x: 0, y: -20 * scale },
                stiffness: 0.6, render: { visible: false }
            });

            const chestRightLeg = Constraint.create({
                bodyA: chest, bodyB: rightLeg,
                pointA: { x: 10 * scale, y: 20 * scale }, pointB: { x: 0, y: -20 * scale },
                stiffness: 0.6, render: { visible: false }
            });

            const person = Composite.create();
            Composite.add(person, [head, chest, leftArm, rightArm, leftLeg, rightLeg, headChest, chestLeftArm, chestRightArm, chestLeftLeg, chestRightLeg]);
            
            return { composite: person, head: head, chest: chest };
        }

        // 初始化角色
        function spawnRagdoll() {
            ragdoll = createRagdoll(window.innerWidth / 2, window.innerHeight / 2, 2.5);
            Composite.add(world, ragdoll.composite);
        }
        spawnRagdoll();

        // 監聽顏色改變
        document.getElementById('skin-color').addEventListener('input', (e) => {
            settings.skin = e.target.value;
            resetRagdoll();
        });
        document.getElementById('shirt-color').addEventListener('input', (e) => {
            settings.shirt = e.target.value;
            resetRagdoll();
        });
        document.getElementById('pants-color').addEventListener('input', (e) => {
            settings.pants = e.target.value;
            resetRagdoll();
        });

        function resetRagdoll() {
            Composite.remove(world, ragdoll.composite);
            spawnRagdoll();
        }

        // --- 滑鼠互動與工具系統 ---
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false }
            }
        });
        Composite.add(world, mouseConstraint);

        let currentTool = 'drag';

        function setTool(tool) {
            currentTool = tool;
            // 更新按鈕樣式
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // 提示文字
            document.getElementById('hint').style.display = 'none';

            // 設定滑鼠約束
            if (tool === 'drag') {
                mouseConstraint.collisionFilter.mask = 0xFFFFFFFF; // 開啟抓取
            } else {
                mouseConstraint.collisionFilter.mask = 0; // 關閉抓取 (讓點擊穿透去觸發事件)
            }
        }

        // 點擊事件處理
        Events.on(mouseConstraint, 'mousedown', function(event) {
            if (currentTool === 'drag') return;

            const mousePos = event.mouse.position;
            const bodies = Composite.allBodies(world);
            
            // 找到點擊到的身體部件
            const clickedBody = Matter.Query.point(bodies, mousePos)[0];

            if (clickedBody && !clickedBody.isStatic) {
                // 1. 重拳模式
                if (currentTool === 'punch') {
                    // 計算向量
                    const forceMagnitude = 0.3 * clickedBody.mass;
                    Body.applyForce(clickedBody, mousePos, {
                        x: (Math.random() - 0.5) * forceMagnitude,
                        y: (Math.random() - 0.5) * forceMagnitude
                    });
                    createEffect(mousePos.x, mousePos.y, '💥', 50);
                    playSound('hit');
                }
                // 2. 球棒模式 (擊飛)
                else if (currentTool === 'bat') {
                     const forceMagnitude = 0.8 * clickedBody.mass;
                     // 總是往右上方打飛
                     Body.applyForce(clickedBody, mousePos, {
                        x: forceMagnitude,
                        y: -forceMagnitude
                    });
                    createEffect(mousePos.x, mousePos.y, '🏏', 60);
                    playSound('hit');
                }
            }

            // 3. 炸彈模式 (不需要點到人，點地板也行)
            if (currentTool === 'bomb') {
                createExplosion(mousePos.x, mousePos.y);
            }
        });

        // 炸彈邏輯
        function createExplosion(x, y) {
            createEffect(x, y, '💣', 80);
            
            const bodies = Composite.allBodies(world);
            bodies.forEach(body => {
                if (!body.isStatic) {
                    const force = Vector.sub(body.position, {x, y});
                    const distance = Vector.magnitude(force);
                    if (distance < 300) { // 爆炸範圍
                        const direction = Vector.normalise(force);
                        const power = (300 - distance) / 300 * 1.5; // 距離越近威力越大
                        Body.applyForce(body, body.position, Vector.mult(direction, power * body.mass));
                    }
                }
            });
            
            setTimeout(() => createEffect(x, y, '🔥', 100), 200);
        }

        // 4. 無重力模式 (持續性)
        Events.on(engine, 'beforeUpdate', function() {
            if (currentTool === 'zerog') {
                const bodies = Composite.allBodies(world);
                bodies.forEach(body => {
                    if (!body.isStatic) {
                        // 給予向上的力抵銷重力，並加一點旋轉
                        Body.applyForce(body, body.position, {x: 0, y: -body.mass * 0.0015});
                    }
                });
            }
            
            // 監測受傷/速度來改變表情
            updateFace();
        });

        // --- 表情與特效系統 ---
        function updateFace() {
            const speed = ragdoll.head.speed;
            const ctx = render.context;
            
            // 在 Matter.js 渲染後，手動畫上臉部
            Events.on(render, 'afterRender', function() {
                const pos = ragdoll.head.position;
                const angle = ragdoll.head.angle;

                ctx.translate(pos.x, pos.y);
                ctx.rotate(angle);

                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                let face = "😐"; // 正常
                if (speed > 15) face = "😱"; // 飛太快
                else if (speed > 5) face = "😵"; // 暈
                else if (currentTool === 'zerog') face = "🤢"; // 失重
                
                ctx.fillText(face, 0, 0);

                ctx.rotate(-angle);
                ctx.translate(-pos.x, -pos.y);
            });
        }

        function createEffect(x, y, text, size) {
            const el = document.createElement('div');
            el.innerText = text;
            el.style.position = 'absolute';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = size + 'px';
            el.style.pointerEvents = 'none';
            el.style.transform = 'translate(-50%, -50%) scale(0)';
            el.style.transition = 'transform 0.2s, opacity 0.5s';
            el.style.zIndex = 100;
            document.body.appendChild(el);

            // 動畫
            setTimeout(() => el.style.transform = 'translate(-50%, -50%) scale(1.5)', 10);
            setTimeout(() => el.style.opacity = 0, 300);
            setTimeout(() => el.remove(), 600);
        }

        function playSound(type) {
            // 簡單的音效合成，不需外部檔案
            // 這裡可以加上 Web Audio API 實作，為保持程式碼簡潔暫略
        }

        // 啟動
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // 視窗縮放處理
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            // 更新牆壁位置
            Body.setPosition(walls[0], {x: window.innerWidth/2, y: window.innerHeight+50});
            Body.setPosition(walls[3], {x: window.innerWidth+50, y: window.innerHeight/2});
        });

    </script>
</body>
</html>
