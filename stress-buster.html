<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stress Buster - 發洩模擬器 2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; overflow: hidden; background: #222;
            font-family: 'Roboto', sans-serif; color: white; user-select: none;
        }

        /* --- 戰前準備室 (Setup Screen) --- */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .setup-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00d2ff;
            padding: 30px; border-radius: 20px;
            text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        .preview-circle {
            width: 100px; height: 100px; border-radius: 50%;
            background: #444; margin: 20px auto;
            border: 4px solid #fff;
            overflow: hidden; position: relative;
            background-size: cover; background-position: center;
        }

        .file-btn {
            background: #ff0055; color: white; padding: 10px 20px;
            border-radius: 30px; cursor: pointer; display: inline-block;
            margin: 10px 0; font-weight: bold;
        }
        input[type="file"] { display: none; }

        .preset-row { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .preset-face {
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; opacity: 0.7;
        }
        .preset-face:hover, .preset-face.selected { border-color: #00d2ff; opacity: 1; transform: scale(1.1); }

        .start-btn {
            background: linear-gradient(45deg, #00d2ff, #007bff);
            border: none; padding: 15px 40px; color: white;
            font-size: 1.5em; border-radius: 50px; cursor: pointer;
            margin-top: 20px; font-family: 'Black Ops One';
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        /* --- 遊戲 UI --- */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; /* 開始後顯示 */
            flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box;
        }

        h1 {
            font-family: 'Black Ops One', cursive; color: #ff3d00;
            text-shadow: 2px 2px 0 #000; margin: 0; font-size: 40px; pointer-events: auto;
        }

        /* 工具列 */
        .toolbar {
            display: flex; gap: 10px; pointer-events: auto;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 15px; align-self: center;
        }
        .tool-btn {
            background: #444; border: 2px solid #666; color: white;
            width: 50px; height: 50px; border-radius: 10px; font-size: 24px;
            cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .tool-btn.active { background: #ff3d00; border-color: #ff9e80; box-shadow: 0 0 15px #ff3d00; transform: scale(1.1); }

        .back-link {
            position: absolute; top: 20px; right: 20px;
            color: #aaa; text-decoration: none; pointer-events: auto; font-weight: bold;
        }

        /* 傷害特效 */
        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-box">
            <h2>🎯 選擇目標</h2>
            <div id="preview" class="preview-circle"></div>
            
            <label class="file-btn">
                📸 上傳照片 (頭像)
                <input type="file" id="upload-input" accept="image/*">
            </label>

            <div style="font-size: 0.9em; color: #aaa; margin: 10px 0;">或選擇預設欠打臉：</div>
            
            <div class="preset-row">
                <img id="p1" class="preset-face" onclick="selectPreset(1)">
                <img id="p2" class="preset-face" onclick="selectPreset(2)">
                <img id="p3" class="preset-face" onclick="selectPreset(3)">
            </div>

            <button class="start-btn" onclick="startGame()">START FIGHT</button>
        </div>
    </div>

    <div id="ui-layer">
        <div>
            <h1>STRESS BUSTER</h1>
            <a href="index.html" class="back-link">⬅ 回首頁</a>
        </div>
        
        <div class="toolbar">
            <button class="tool-btn active" onclick="setTool('drag')" title="抓取">✋</button>
            <button class="tool-btn" onclick="setTool('punch')" title="重拳">🥊</button>
            <button class="tool-btn" onclick="setTool('bat')" title="球棒">🏏</button>
            <button class="tool-btn" onclick="setTool('bomb')" title="炸彈">💣</button>
            <button class="tool-btn" onclick="setTool('zerog')" title="無重力">🌌</button>
        </div>
    </div>

    <div id="flash-overlay"></div>

    <script>
        // --- 變數與設定 ---
        let targetImage = null; // 最終選定的頭像圖片物件
        let isGameStarted = false;
        
        // --- 預設頭像生成 (使用 Canvas 繪製簡單表情，避免外部連結失效) ---
        function generateFace(type) {
            const c = document.createElement('canvas');
            c.width = 100; c.height = 100;
            const ctx = c.getContext('2d');
            
            // 膚色
            ctx.fillStyle = type === 1 ? '#ffccaa' : (type === 2 ? '#e0ac69' : '#fff');
            ctx.beginPath(); ctx.arc(50,50,50,0,Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.font = 'bold 60px Arial';
            
            if(type === 1) ctx.fillText('😈', 50, 70); // 惡魔
            if(type === 2) ctx.fillText('🤡', 50, 70); // 小丑
            if(type === 3) ctx.fillText('👽', 50, 70); // 外星人

            return c.toDataURL();
        }

        // 初始化預設圖
        document.getElementById('p1').src = generateFace(1);
        document.getElementById('p2').src = generateFace(2);
        document.getElementById('p3').src = generateFace(3);
        
        // 預設選第一個
        let currentFaceUrl = generateFace(1);
        document.getElementById('preview').style.backgroundImage = `url(${currentFaceUrl})`;

        // --- 圖片上傳處理 ---
        document.getElementById('upload-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file){
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentFaceUrl = evt.target.result;
                    document.getElementById('preview').style.backgroundImage = `url(${currentFaceUrl})`;
                    // 清除預設選取狀態
                    document.querySelectorAll('.preset-face').forEach(el => el.classList.remove('selected'));
                };
                reader.readAsDataURL(file);
            }
        });

        function selectPreset(id) {
            currentFaceUrl = generateFace(id);
            document.getElementById('preview').style.backgroundImage = `url(${currentFaceUrl})`;
            document.querySelectorAll('.preset-face').forEach(el => el.classList.remove('selected'));
            document.getElementById('p'+id).classList.add('selected');
        }

        function startGame() {
            // 準備圖片材質
            const img = new Image();
            img.src = currentFaceUrl;
            img.onload = () => {
                targetImage = img;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('ui-layer').style.display = 'flex';
                isGameStarted = true;
                initPhysics(); // 啟動物理引擎
            };
        }

        // ==========================================
        //         MATTER.JS 物理引擎核心
        // ==========================================
        
        // 模組別名
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Constraint = Matter.Constraint,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events,
              Body = Matter.Body,
              Vector = Matter.Vector;

        let engine, render, runner, ragdollHead;

        function initPhysics() {
            engine = Engine.create();
            const world = engine.world;

            render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    wireframes: false,
                    background: '#222'
                }
            });

            // 邊界
            const walls = [
                Bodies.rectangle(window.innerWidth/2, window.innerHeight+50, window.innerWidth, 100, { isStatic: true, render: {fillStyle: '#444'} }),
                Bodies.rectangle(window.innerWidth/2, -500, window.innerWidth, 1000, { isStatic: true }),
                Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight*3, { isStatic: true }),
                Bodies.rectangle(window.innerWidth+50, window.innerHeight/2, 100, window.innerHeight*3, { isStatic: true })
            ];
            Composite.add(world, walls);

            // 生成角色
            createRagdoll(window.innerWidth/2, window.innerHeight/2);

            // 滑鼠控制
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);

            // 工具邏輯監聽
            Events.on(mouseConstraint, 'mousedown', handleToolClick);
            
            // 每一幀的渲染後處理 (畫表情)
            Events.on(render, 'afterRender', drawFaceExpressions);

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);
        }

        // --- 布娃娃生成 ---
        function createRagdoll(x, y) {
            const scale = 2.0;
            const group = Body.nextGroup(true);

            // 頭部：使用選定的圖片
            ragdollHead = Bodies.circle(x, y - 25 * scale, 20 * scale, { 
                collisionFilter: { group: group },
                render: {
                    sprite: {
                        texture: currentFaceUrl,
                        xScale: (40 * scale) / 100, // 假設原圖/Canvas是100x100，縮放到適合大小
                        yScale: (40 * scale) / 100
                    }
                },
                label: 'Head'
            });

            // 身體部位
            const chest = Bodies.rectangle(x, y, 30 * scale, 40 * scale, { 
                collisionFilter: { group: group }, chamfer: { radius: 10 },
                render: { fillStyle: '#ffffff' }, label: 'Body'
            });
            
            // 手腳設定
            const limbAttr = { collisionFilter: { group: group }, chamfer: { radius: 5 }, render: { fillStyle: '#f1c27d' } };
            const pantsAttr = { collisionFilter: { group: group }, chamfer: { radius: 5 }, render: { fillStyle: '#333' } };

            const leftArm = Bodies.rectangle(x - 20 * scale, y, 10 * scale, 35 * scale, limbAttr);
            const rightArm = Bodies.rectangle(x + 20 * scale, y, 10 * scale, 35 * scale, limbAttr);
            const leftLeg = Bodies.rectangle(x - 10 * scale, y + 40 * scale, 12 * scale, 45 * scale, pantsAttr);
            const rightLeg = Bodies.rectangle(x + 10 * scale, y + 40 * scale, 12 * scale, 45 * scale, pantsAttr);

            // 關節連接
            const headChest = Constraint.create({
                bodyA: ragdollHead, bodyB: chest,
                pointA: { x: 0, y: 15 * scale }, pointB: { x: 0, y: -20 * scale },
                stiffness: 0.6, render: { visible: false }
            });
            
            // ...其他關節 (簡化寫法)
            const join = (bodyA, bodyB, xA, yA, xB, yB) => Constraint.create({
                bodyA, bodyB, pointA: {x:xA*scale, y:yA*scale}, pointB: {x:xB*scale, y:yB*scale},
                stiffness: 0.6, render: { visible: false }
            });

            const allBodies = [
                ragdollHead, chest, leftArm, rightArm, leftLeg, rightLeg,
                headChest,
                join(chest, leftArm, -15, -15, 0, -15),
                join(chest, rightArm, 15, -15, 0, -15),
                join(chest, leftLeg, -10, 20, 0, -20),
                join(chest, rightLeg, 10, 20, 0, -20)
            ];

            Composite.add(engine.world, allBodies);
        }

        // --- 工具邏輯 ---
        let currentTool = 'drag';

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function handleToolClick(event) {
            if (currentTool === 'drag') return;

            const mousePos = event.mouse.position;
            const bodies = Composite.allBodies(engine.world);
            const clickedBody = Matter.Query.point(bodies, mousePos)[0];

            if (currentTool === 'bomb') {
                createExplosion(mousePos.x, mousePos.y);
                return;
            }

            if (clickedBody && !clickedBody.isStatic) {
                if (currentTool === 'punch') {
                    applyHit(clickedBody, mousePos, 0.4);
                    createEffect(mousePos.x, mousePos.y, '💥', 60);
                } else if (currentTool === 'bat') {
                    Body.applyForce(clickedBody, mousePos, { x: 0.8 * clickedBody.mass, y: -0.8 * clickedBody.mass });
                    createEffect(mousePos.x, mousePos.y, '🏏', 80);
                    triggerPain();
                }
            }
        }

        function applyHit(body, pos, power) {
            Body.applyForce(body, pos, {
                x: (Math.random() - 0.5) * power * body.mass,
                y: (Math.random() - 0.5) * power * body.mass
            });
            triggerPain();
        }

        function createExplosion(x, y) {
            createEffect(x, y, '💣', 100);
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(body => {
                if (!body.isStatic) {
                    const force = Vector.sub(body.position, {x, y});
                    const dist = Vector.magnitude(force);
                    if (dist < 300) {
                        const dir = Vector.normalise(force);
                        Body.applyForce(body, body.position, Vector.mult(dir, (300-dist)/300 * 2.0 * body.mass));
                    }
                }
            });
            triggerPain();
        }

        // 螢幕閃紅特效
        function triggerPain() {
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = 0.3;
            setTimeout(() => flash.style.opacity = 0, 100);
        }

        // --- 動態表情繪製系統 ---
        function drawFaceExpressions() {
            if(!ragdollHead) return;
            
            const ctx = render.context;
            const pos = ragdollHead.position;
            const angle = ragdollHead.angle;
            const speed = ragdollHead.speed;

            // 判斷狀態
            let state = 'normal';
            if (speed > 15) state = 'heavy_damage';
            else if (speed > 5) state = 'pain';
            else if (currentTool === 'zerog') state = 'dizzy';

            if (state === 'normal') return; // 正常狀態不畫東西，顯示原圖

            // 在頭部位置畫表情覆蓋層
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);

            // 畫筆設定
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            if (state === 'pain') {
                // 畫上 X_X 的眼睛
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.font = "bold 30px Arial";
                ctx.fillText("X  X", 0, -5);
                // 嘴巴
                ctx.beginPath();
                ctx.arc(0, 15, 10, 0, Math.PI, true); 
                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(0,0,0,0.8)";
                ctx.stroke();
            } 
            else if (state === 'heavy_damage') {
                // 整個臉變紅濾鏡
                ctx.beginPath();
                ctx.arc(0, 0, 40, 0, Math.PI*2);
                ctx.fillStyle = "rgba(255, 0, 0, 0.4)";
                ctx.fill();
                
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.fillText("😱", 0, 0);
            }
            else if (state === 'dizzy') {
                ctx.fillStyle = "rgba(0,255,0,0.3)";
                ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
                ctx.font = "40px Arial";
                ctx.fillText("🤢", 0, 0);
            }

            ctx.restore();
        }

        // 無重力工具邏輯
        Events.on(engine, 'beforeUpdate', function() {
            if (currentTool === 'zerog') {
                Composite.allBodies(engine.world).forEach(b => {
                    if(!b.isStatic) Body.applyForce(b, b.position, {x:0, y: -b.mass * 0.0015});
                });
            }
        });

        // 輔助特效
        function createEffect(x, y, text, size) {
            const el = document.createElement('div');
            el.innerText = text;
            el.style.cssText = `position:absolute; left:${x}px; top:${y}px; font-size:${size}px; transform:translate(-50%,-50%); pointer-events:none; transition:0.5s; z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = 0; el.style.transform = 'translate(-50%, -100px)'; }, 50);
            setTimeout(() => el.remove(), 550);
        }

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
