<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼</title>
    <link rel="stylesheet" href="css/nexus-ui.css">
    <script src="js/nexus-system.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; text-align: center; padding-top: 50px; }
        .container { background: #2d2d44; padding: 40px; border-radius: 10px; display: inline-block; width: 320px; }
        .choices { display: flex; justify-content: space-around; margin: 30px 0; }
        .btn { font-size: 3em; background: none; border: 2px solid #444; border-radius: 50%; width: 80px; height: 80px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #3d3d5c; transform: scale(1.1); border-color: #00d2ff; }
        #result { font-size: 1.5em; margin-top: 20px; font-weight: bold; min-height: 60px;}
        .score { margin-top: 10px; color: #aaa; font-size: 0.9em;}
        .back-btn { display: block; margin-top: 30px; color: #aaa; text-decoration: none; border: 1px solid #444; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>
    <div class="nexus-game-container nexus-container">
        <h1>✊ 包剪揼 🖐</h1>
        <div class="score">你: <span id="userScore">0</span> | 電腦: <span id="compScore">0</span></div>
        
        <div class="choices">
            <button class="nexus-btn" onclick="play('✊')" style="font-size: 2em; width: 80px; height: 80px; border-radius: 50%;">✊</button>
            <button class="nexus-btn" onclick="play('🖐')" style="font-size: 2em; width: 80px; height: 80px; border-radius: 50%;">🖐</button>
            <button class="nexus-btn" onclick="play('✌️')" style="font-size: 2em; width: 80px; height: 80px; border-radius: 50%;">✌️</button>
        </div>

        <div id="result" style="font-size: 1.5em; margin: 20px 0; font-weight: bold;">請出拳...</div>
        <a href="index.html" class="nexus-btn">← 返回遊戲大廳</a>
    </div>

    <script>
        let userScore = 0;
        let compScore = 0;
        const choices = ['✊', '🖐', '✌️'];

        let gameStartTime = Date.now();
        
        function play(userChoice) {
            const compChoice = choices[Math.floor(Math.random() * 3)];
            let result = "";
            let isWin = false;

            if (userChoice === compChoice) {
                result = "打和！";
            } else if (
                (userChoice === '✊' && compChoice === '✌️') ||
                (userChoice === '🖐' && compChoice === '✊') ||
                (userChoice === '✌️' && compChoice === '🖐')
            ) {
                result = "你要贏了！";
                userScore++;
                isWin = true;
            } else {
                result = "你輸了！";
                compScore++;
            }

            // 更新顯示
            const resultEl = document.getElementById('result');
            resultEl.innerHTML = `你: ${userChoice}  vs  電腦: ${compChoice}<br><span style="color:${isWin ? 'var(--success-color)' : 'var(--error-color)'}">${result}</span>`;
            
            document.getElementById('userScore').innerText = userScore;
            document.getElementById('compScore').innerText = compScore;

            // 使用 NEXUS 系統
            if (window.nexus) {
                if (isWin) {
                    window.nexus.visualFeedback.showSuccess(resultEl, result);
                } else {
                    window.nexus.visualFeedback.showError(resultEl, result);
                }
            }

            // 記錄遊戲數據
            const gameDuration = Math.floor((Date.now() - gameStartTime) / 1000);
            if (window.nexus) {
                window.nexus.gameProgress.recordGamePlay('game1', isWin ? 1 : 0, gameDuration);
            }
        }
    </script>
</body>
</html>
