<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的遊戲館</title>
    <style>
        /* --- 基礎設定 --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e; /* 深藍色背景 */
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 { 
            margin-bottom: 10px; 
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); /* 標題發光特效 */
        }
        
        p.subtitle { color: #aaa; margin-bottom: 50px; }

        /* --- 分類區塊樣式 --- */
        .category-section {
            margin-bottom: 60px; /* 每個分類之間的距離 */
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .category-title {
            text-align: left;
            font-size: 1.5em;
            color: #00d2ff; /* 霓虹藍 */
            border-bottom: 2px solid #2d2d44;
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-left: 10px;
        }

        /* --- 遊戲卡片容器 (Flexbox 排版) --- */
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start; /* 靠左對齊 */
            gap: 20px;
            padding: 0 10px;
        }

        /* --- 單張卡片樣式 --- */
        .game-card {
            background: #2d2d44;
            padding: 25px;
            width: 140px; /* 卡片固定寬度 */
            border-radius: 15px;
            text-decoration: none; /* 去除超連結底線 */
            color: white;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 滑鼠移過去的特效 */
        .game-card:hover { 
            background: #3d3d5c; 
            transform: translateY(-5px); /* 微微浮起 */
            border-color: #00d2ff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .icon { font-size: 3em; margin-bottom: 10px; }
        .title { font-weight: bold; font-size: 1.1em; }
        
        /* 卡片上的小標籤 (例如：需鏡頭) */
        .tag {
            font-size: 0.7em;
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 5px;
            color: #aaa;
        }
        .tag.hot { color: #ffeb3b; background: rgba(255, 235, 59, 0.1); }

    </style>
</head>
<body>

    <h1>🎮 我的遊戲館</h1>
    <p class="subtitle">歡迎來到我的個人遊戲作品集</p>

    <div class="category-section">
        <div class="category-title">🧠 益智與運氣</div>
        <div class="games-grid">
            
            <a href="game1.html" class="game-card">
                <div class="icon">🎯</div>
                <div class="title">猜數字</div>
                <div class="tag">經典</div>
            </a>

            <a href="game2.html" class="game-card">
                <div class="icon">✊</div>
                <div class="title">包剪揼</div>
                <div class="tag">運氣</div>
            </a>
            <a href="minesweeper.html" class="game-card">
                <div class="icon">💣</div>
                <div class="title">踩地雷</div>
                <div class="tag">9x9</div>
            </a>

        </div>
    </div>

    <div class="category-section">
        <div class="category-title">✨ 體感與特效 (WebCam)</div>
        <div class="games-grid">
            
            <a href="game3.html" class="game-card">
                <div class="icon">🌌</div>
                <div class="title">魔法粒子</div>
                <div class="tag hot">需開鏡頭</div>
            </a>

        </div>
    </div>

    <div class="category-section">
        <div class="category-title">🔧 開發測試區</div>
        <div class="games-grid">
            
            <a href="template.html" class="game-card" style="opacity: 0.6; border-style: dashed;">
                <div class="icon">📝</div>
                <div class="title">新遊戲模版</div>
                <div class="tag">開發中</div>
            </a>

        </div>
    </div>

</body>
</html>
