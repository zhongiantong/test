<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際捕手 - 體感遊戲 (優化版)</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            margin-top: 20px;
            border: 4px solid #00d2ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            background: #111;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 2px 2px 0 #000;
        }

        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 24px;
            background: #00d2ff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 20px #00d2ff;
            z-index: 20;
        }
        
        .back-link { margin-top: 20px; color: #aaa; text-decoration: none; }
        
        /* 說明文字 */
        .instruction {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2 style="margin: 10px 0;">👋 揮手接星星 (防頭部誤觸版)</h2>

    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">分數: <span id="score">0</span></div>
            <div class="instruction">避開中間紅框(你的頭)，用手去接旁邊的星星！</div>
            <button id="start-btn" onclick="startGame()">允許鏡頭並開始</button>
        </div>
    </div>

    <a href="index.html" class="back-link">⬅ 回到首頁</a>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let isPlaying = false;
        let prevFrame = null;
        let items = [];
        const maxItems = 5;
        
        canvas.width = 640;
        canvas.height = 480;

        // 定義忽略區域 (頭部位置：中間 30% 寬度，上方 60% 高度)
        // 這裡的座標是基於畫布的
        const deadZone = {
            x: canvas.width * 0.35,
            width: canvas.width * 0.3,
            y: 0,
            height: canvas.height * 0.6
        };

        async function startGame() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                isPlaying = true;
                loop();
                spawnItem();
            } catch (err) {
                alert("請允許鏡頭權限");
            }
        }

        function spawnItem() {
            if (!isPlaying) return;
            if (items.length < maxItems) {
                // 優化：讓星星更有可能出現在兩側，避開正中間
                let spawnX;
                if (Math.random() > 0.5) {
                    spawnX = Math.random() * (canvas.width * 0.3); // 左側
                } else {
                    spawnX = (canvas.width * 0.7) + Math.random() * (canvas.width * 0.3); // 右側
                }

                items.push({
                    x: spawnX,
                    y: -50,
                    speed: 3 + Math.random() * 3,
                    type: Math.random() > 0.8 ? 'bomb' : 'star',
                    icon: Math.random() > 0.8 ? '💣' : '🌟',
                    size: 40
                });
            }
            setTimeout(spawnItem, 1000);
        }

        function detectMotion() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 繪製紅色的「頭部忽略區」框框
            ctx.strokeStyle = "rgba(255, 0, 0, 0.3)";
            ctx.lineWidth = 2;
            ctx.strokeRect(deadZone.x, deadZone.y, deadZone.width, deadZone.height);

            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (!prevFrame) { prevFrame = currentFrame; return; }

            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                
                // 如果星星進入了「頭部忽略區」，直接跳過偵測
                if (item.x > deadZone.x && item.x < deadZone.x + deadZone.width &&
                    item.y > deadZone.y && item.y < deadZone.y + deadZone.height) {
                    continue; 
                }

                // 偵測碰撞
                const startY = Math.floor(Math.max(0, item.y));
                const endY = Math.floor(Math.min(canvas.height, item.y + item.size));
                const startX = Math.floor(Math.max(0, item.x));
                const endX = Math.floor(Math.min(canvas.width, item.x + item.size));

                let motionPixels = 0;

                for (let y = startY; y < endY; y += 4) {
                    for (let x = startX; x < endX; x += 4) {
                        const pos = (y * canvas.width + x) * 4;
                        const diff = Math.abs(currentFrame.data[pos+1] - prevFrame.data[pos+1]); // 只比對綠色通道
                        
                        // 提高閾值：必須是明顯的變化 (原本是 > 20)
                        if (diff > 50) {
                            motionPixels++;
                        }
                    }
                }

                // 提高觸發門檻：需要更多像素變動
                if (motionPixels > 15) {
                    if (item.type === 'star') {
                        score += 10;
                        scoreEl.style.color = '#ffeb3b';
                    } else {
                        score -= 20;
                        scoreEl.style.color = '#ff4444';
                    }
                    scoreEl.innerText = score;
                    items.splice(i, 1);
                    i--;
                }
            }
            prevFrame = currentFrame;
        }

        function loop() {
            if (!isPlaying) return;
            detectMotion(); 
            
            ctx.font = "40px Arial";
            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;
                ctx.fillText(item.icon, item.x, item.y);
                if (item.y > canvas.height) {
                    items.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
