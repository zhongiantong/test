<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際捕手 - 體感遊戲</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 遊戲容器 */
        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            margin-top: 20px;
            border: 4px solid #00d2ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            background: #111;
        }

        /* 影片與畫布重疊 */
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* 鏡像翻轉，讓操作更直覺 */
        }

        /* 介面 UI */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透 */
            z-index: 10;
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 2px 2px 0 #000;
        }

        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 24px;
            background: #00d2ff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 20px #00d2ff;
            z-index: 20;
        }
        
        .back-link {
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2 style="margin: 10px 0;">👋 揮手接星星</h2>

    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">分數: <span id="score">0</span></div>
            <button id="start-btn" onclick="startGame()">允許鏡頭並開始</button>
        </div>
    </div>

    <a href="index.html" class="back-link">⬅ 回到首頁</a>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let isPlaying = false;
        let prevFrame = null;
        
        // 遊戲物件
        let items = [];
        const maxItems = 5;
        
        // 設定畫布尺寸
        canvas.width = 640;
        canvas.height = 480;

        // 1. 啟動鏡頭
        async function startGame() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                isPlaying = true;
                loop();
                spawnItem();
            } catch (err) {
                alert("無法存取鏡頭，請確認權限或是網址是否為 HTTPS / Localhost");
                console.error(err);
            }
        }

        // 2. 產生掉落物
        function spawnItem() {
            if (!isPlaying) return;
            if (items.length < maxItems) {
                const isBomb = Math.random() > 0.8; // 20% 機率是炸彈
                items.push({
                    x: Math.random() * (canvas.width - 50),
                    y: -50,
                    speed: 2 + Math.random() * 3,
                    type: isBomb ? 'bomb' : 'star',
                    icon: isBomb ? '💣' : '🌟',
                    size: 40
                });
            }
            setTimeout(spawnItem, 1000);
        }

        // 3. 偵測動作 (簡單的像素比對)
        function detectMotion() {
            // 畫出當前影片影格
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // 如果還沒有上一幀，就先存起來
            if (!prevFrame) {
                prevFrame = currentFrame;
                return;
            }

            // 比對像素
            // 為了效能，我們每 4 個像素檢查一次 (skip pixels)
            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                let motionDetected = false;

                // 檢查物件周圍的像素是否有劇烈變化
                // 注意：因為鏡像，畫面座標需要轉換
                // 這裡簡化處理，直接檢查該區域的像素變化量
                
                const startY = Math.floor(Math.max(0, item.y));
                const endY = Math.floor(Math.min(canvas.height, item.y + item.size));
                const startX = Math.floor(Math.max(0, item.x));
                const endX = Math.floor(Math.min(canvas.width, item.x + item.size));

                let changeScore = 0;

                for (let y = startY; y < endY; y += 4) {
                    for (let x = startX; x < endX; x += 4) {
                        const pos = (y * canvas.width + x) * 4;
                        // 比較 R, G, B
                        const rDiff = Math.abs(currentFrame.data[pos] - prevFrame.data[pos]);
                        const gDiff = Math.abs(currentFrame.data[pos+1] - prevFrame.data[pos+1]);
                        const bDiff = Math.abs(currentFrame.data[pos+2] - prevFrame.data[pos+2]);
                        
                        if (rDiff + gDiff + bDiff > 100) {
                            changeScore++;
                        }
                    }
                }

                // 如果變化量夠大，判定為碰到
                if (changeScore > 5) {
                    if (item.type === 'star') {
                        score += 10;
                        scoreEl.style.color = '#ffeb3b';
                    } else {
                        score -= 20;
                        scoreEl.style.color = '#ff4444';
                    }
                    scoreEl.innerText = score;
                    items.splice(i, 1); // 移除物件
                    i--;
                }
            }

            prevFrame = currentFrame;
        }

        // 4. 遊戲主迴圈
        function loop() {
            if (!isPlaying) return;

            // 處理動作偵測與繪圖背景
            detectMotion(); 

            // 繪製掉落物
            ctx.font = "40px Arial";
            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;

                ctx.fillText(item.icon, item.x, item.y);

                // 掉出畫面移除
                if (item.y > canvas.height) {
                    items.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(loop);
        }

    </script>
</body>
</html>
