<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNIFER CLASSROOM v10.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/imgly-background-removal.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00f3ff; --danger: #ff003c; --bg: #111; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Roboto', sans-serif; user-select: none; touch-action: none; }

        /* 場景 */
        #stage {
            position: fixed; inset: 0; background-size: cover; background-position: center; transition: 0.3s;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://img.freepik.com/free-photo/empty-classroom-interior-with-wooden-desks_107791-1522.jpg');
        }

        /* 角色 (物理核心) */
        #pet {
            position: absolute; width: 280px; height: 280px;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            touch-action: none; cursor: grab; z-index: 10;
        }
        #pet:active { cursor: grabbing; }
        #pet img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
            border: 6px solid rgba(255,255,255,0.2); pointer-events: none;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
            transition: transform 0.1s;
        }

        /* 氣泡 */
        #bubble {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%) scale(0);
            background: #fff; border: 3px solid var(--danger); color: var(--danger);
            padding: 15px 25px; border-radius: 30px; font-size: 18px;
            font-weight: 900; white-space: nowrap; pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #bubble::after { content:''; position: absolute; bottom:-12px; left:50%; transform:translateX(-50%); border:12px solid transparent; border-top-color:var(--danger); }

        /* UI 層 */
        #info-panel {
            position: absolute; top: 20px; left: 20px; color: white;
            font-family: 'Black Ops One'; letter-spacing: 1px;
            text-shadow: 0 2px 5px black; z-index: 5;
        }

        /* 設定層 UI */
        #setup {
            position: fixed; inset: 0; background: #0a0a0a; z-index: 999;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            overflow-y: auto; background-image: radial-gradient(#222 10%, transparent 10%);
            background-size: 20px 20px;
        }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; width: 100%; max-width: 340px; margin-bottom: 20px; border: 1px solid #333; }
        
        h2 { color: var(--danger); margin: 0 0 15px 0; font-family: 'Black Ops One'; text-align: center; font-size: 24px; }
        label { color: #888; font-size: 12px; display: block; margin-bottom: 5px; font-weight: bold; }

        input[type="text"], textarea {
            width: 100%; background: #000; border: 1px solid #444; color: white;
            padding: 12px; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px;
            font-family: 'Roboto', sans-serif;
        }
        input:focus, textarea:focus { border-color: var(--danger); outline: none; }
        textarea { height: 120px; font-size: 14px; line-height: 1.4; color: #ccc; }

        .btn-start {
            width: 100%; max-width: 340px; padding: 18px; background: var(--danger); color: white;
            border: none; border-radius: 50px; font-weight: 900; font-size: 20px; letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.4); cursor: pointer; transition: 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* 上傳 */
        .preview-box { width: 120px; height: 120px; border-radius: 50%; background: #000; overflow: hidden; margin: 0 auto 10px; border: 2px dashed #444; position: relative;}
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .loading-text { position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:10px; color:var(--primary); display:none; text-align: center; width: 100%;}

    </style>
</head>
<body>

    <div id="setup">
        <div class="card">
            <h2>TEACHER JENNIFER</h2>
            
            <div class="preview-box" onclick="document.getElementById('file').click()">
                <img id="prev-img" style="display:none">
                <span id="cam-icon" style="line-height:120px; font-size:40px; color:#333; display:block; text-align:center;">📷</span>
                <div id="load-txt" class="loading-text">REMOVING BG...</div>
            </div>
            <input type="file" id="file" hidden accept="image/*">
            
            <label>YOUR NAME (學生姓名)</label>
            <input type="text" id="p-name" placeholder="Enter your name" value="Tom">
        </div>

        <div class="card">
            <label>CATCHPHRASES (已預設 Jennifer 語錄)</label>
            <textarea id="custom-text">Put your electronic devices in your backpack,
Folks,
Ladies,
Class dismiss,
Line up with (玩家名),
I need to see (玩家名) after class</textarea>
            <div style="font-size:10px; color:#555; margin-top:5px;">* (玩家名) will be replaced by your name.</div>
        </div>

        <button class="btn-start" onclick="startGame()">ENTER CLASS</button>
    </div>

    <div id="stage">
        <div id="info-panel">
            <div style="font-size:14px; color:#888">STUDENT:</div>
            <div id="disp-name" style="font-size:24px; color:var(--primary)">PLAYER</div>
            <div style="margin-top:5px; font-size:12px; color:#ff5555">CONDUCT: POOR</div>
        </div>

        <div id="pet">
            <div id="bubble"></div>
            <img id="pet-img">
        </div>
    </div>

    <script>
        // --- 變數 ---
        let phrases = [];
        let vx = 0, vy = 0; 
        let x = window.innerWidth / 2, y = window.innerHeight / 2;
        let isDragging = false;
        let lastX, lastY;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let playerName = "Student";

        // --- 1. 圖片處理 ---
        document.getElementById('file').addEventListener('change', async (e) => {
            const f = e.target.files[0];
            if(!f) return;
            
            const prev = document.getElementById('prev-img');
            const icon = document.getElementById('cam-icon');
            const load = document.getElementById('load-txt');

            icon.style.display = 'none';
            load.style.display = 'block';
            prev.style.display = 'block';
            prev.src = URL.createObjectURL(f); 
            
            try {
                const blob = await imglyRemoveBackground(f, { publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.3.0/dist/" });
                const url = URL.createObjectURL(blob);
                prev.src = url;
                document.getElementById('pet-img').src = url;
            } catch(e) {
                document.getElementById('pet-img').src = URL.createObjectURL(f);
            }
            load.style.display = 'none';
        });

        // --- 2. 遊戲初始化 ---
        function startGame() {
            playerName = document.getElementById('p-name').value || "You";
            document.getElementById('disp-name').innerText = playerName.toUpperCase();

            // 處理語錄替換
            const raw = document.getElementById('custom-text').value;
            // 將 (玩家名) 替換成輸入的名字
            phrases = raw.split(/,|\n/).map(s => {
                let clean = s.trim();
                return clean.replace(/\(玩家名\)/g, playerName);
            }).filter(s => s);

            if(phrases.length === 0) phrases = ["Silence.", "Sit down."];

            document.getElementById('setup').style.display = 'none';
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // 開場白
            speak("All eyes on me.");
            
            physicsLoop();
        }

        // --- 3. 物理引擎 (Throw & Drag) ---
        const pet = document.getElementById('pet');
        const petImg = document.querySelector('#pet img');

        pet.addEventListener('mousedown', start);
        pet.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);

        function start(e) {
            e.preventDefault();
            isDragging = true;
            vx = 0; vy = 0;
            pet.style.cursor = 'grabbing';
            petImg.style.transform = 'scale(1.1)'; // 抓起放大
            
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            lastX = cx; lastY = cy;
            
            // 抓起音效
            playSound(300, 'triangle');
            speak("What are you doing?");
        }

        function move(e) {
            if(!isDragging) return;
            e.preventDefault();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;

            let dx = cx - lastX;
            let dy = cy - lastY;
            x += dx; y += dy;
            vx = dx * 1.5; vy = dy * 1.5; // 計算拋擲力度

            lastX = cx; lastY = cy;
            updatePos();
        }

        function end() {
            if(!isDragging) return;
            isDragging = false;
            pet.style.cursor = 'grab';
            petImg.style.transform = 'scale(1)';

            // 判斷是點擊還是拋擲
            if(Math.abs(vx) < 2 && Math.abs(vy) < 2) {
                tapInteraction();
            } else {
                // 拋擲
                speak("UNHAND ME!"); 
                playSound(150, 'sawtooth'); // 尖銳聲音
            }
        }

        function physicsLoop() {
            if(!isDragging) {
                // 彈簧中心引力
                let centerX = window.innerWidth / 2;
                let centerY = window.innerHeight / 2;
                vx += (centerX - x) * 0.04;
                vy += (centerY - y) * 0.04;
                
                // 阻力
                vx *= 0.92; vy *= 0.92;
                x += vx; y += vy;
                
                // 轉動效果
                petImg.style.transform = `rotate(${vx * 1.5}deg)`;
                updatePos();
            }
            requestAnimationFrame(physicsLoop);
        }

        function updatePos() {
            pet.style.left = x + 'px';
            pet.style.top = y + 'px';
        }

        // --- 4. 互動與說話 ---
        function tapInteraction() {
            // 隨機選一句
            const text = phrases[Math.floor(Math.random() * phrases.length)];
            speak(text);
            playSound(600, 'sine'); // 提示音
            
            // 震動特效
            document.body.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
            setTimeout(()=> document.body.style.transform = 'none', 100);
        }

        function speak(text) {
            const b = document.getElementById('bubble');
            b.innerText = text;
            b.style.transform = "translateX(-50%) scale(1)";
            
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; // 強制美式發音
            u.rate = 1.1; // 語速稍快
            u.pitch = 0.9; // 語調稍低沈嚴肅
            
            // 嘗試尋找好的英文語音
            const voices = window.speechSynthesis.getVoices();
            const engVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB'));
            if(engVoice) u.voice = engVoice;

            window.speechSynthesis.speak(u);

            setTimeout(() => b.style.transform = "translateX(-50%) scale(0)", 3000);
        }

        function playSound(freq, type) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    </script>
</body>
</html>
