<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNIFER</title> <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/imgly-background-removal.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00f3ff; --danger: #ff003c; --bar-bg: rgba(0,0,0,0.6); }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; user-select: none; touch-action: none; }

        /* 場景 */
        #stage { position: fixed; inset: 0; transition: 0.5s; z-index: 0; }
        .bg-livingroom { background: linear-gradient(to bottom, #ffeebb 0%, #c19a6b 90%, #8d6e63 90%); } 
        .bg-park { background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 85%, #228B22 85%); }
        .bg-class { background: linear-gradient(to bottom, #2F4F4F 0%, #3e2723 85%, #1a100c 85%); box-shadow: inset 0 0 100px black; }

        /* 閃光燈特效 (拍照用) */
        #flash-overlay {
            position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 900; transition: opacity 0.1s;
        }

        /* 狀態列 */
        #status-panel {
            position: absolute; top: 15px; left: 15px; width: 140px;
            display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: none; 
        }
        #status-panel button { pointer-events: auto; }
        
        .bar-box {
            background: var(--bar-bg); border-radius: 10px; padding: 4px 8px;
            display: flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.3);
        }
        .icon { font-size: 14px; width: 20px; text-align: center; color:white; }
        .progress-track { flex: 1; height: 8px; background: #333; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; transition: width 0.3s, background 0.3s; }
        
        /* 角色 */
        #pet-container {
            position: absolute; width: 260px; height: 260px;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            touch-action: none; cursor: grab; z-index: 10;
        }
        #pet-img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.5); pointer-events: none;
            transition: transform 0.1s; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }
        
        /* 狀態樣式 */
        .dirty { filter: sepia(0.8) brightness(0.8) !important; border-color: #5d4037 !important; }
        .sad { filter: grayscale(1) brightness(0.7) contrast(1.2) !important; } 
        .sick { filter: hue-rotate(90deg) !important; }
        .attack { transition: transform 0.2s cubic-bezier(0.1, 0.7, 1.0, 0.1) !important; transform: scale(30) !important; } /* 恐怖衝刺 */

        /* 7. 軌跡特效 */
        .trail-dot {
            position: absolute; width: 15px; height: 15px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.4); pointer-events: none; z-index: 5;
            animation: fadeOut 0.8s forwards;
        }
        @keyframes fadeOut { to { transform: scale(0); opacity: 0; } }

        /* 8. 泡泡特效 */
        .bubble-particle {
            position: absolute; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.2);
            border-radius: 50%; pointer-events: none; z-index: 20;
            animation: bubbleUp 1s forwards;
        }
        @keyframes bubbleUp { 0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-100px) scale(0); opacity:0;} }

        /* 屎 */
        .poop { 
            position: absolute; font-size: 45px; z-index: 100; cursor: grab;
            animation: bounce 1s infinite alternate; 
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); user-select: none;
        }
        .poop:active { cursor: grabbing; transform: scale(1.2); }
        @keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-5px);} }
        
        /* 蒼蠅 */
        .fly { position: absolute; font-size: 20px; animation: fly 0.5s infinite linear; z-index: 15; pointer-events: none; }
        @keyframes fly { 0%{transform:translate(0,0)} 25%{transform:translate(5px,-5px)} 50%{transform:translate(0,-10px)} 75%{transform:translate(-5px,-5px)} 100%{transform:translate(0,0)} }

        /* 道具層 */
        #active-tool {
            position: absolute; font-size: 80px; pointer-events: none; z-index: 200;
            display: none; transform: translate(-50%, -50%); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        /* 底部工具列 */
        .dock {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(255,255,255,0.25); padding: 15px; border-radius: 50px;
            backdrop-filter: blur(10px); z-index: 20; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .dock-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 28px;
            cursor: pointer; background: rgba(255,255,255,0.9); transition: 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        .dock-btn:active { transform: scale(0.9); }

        /* 10. 氣泡 (停留時間改長) */
        #bubble {
            position: absolute; top: -120px; left: 50%; transform: translateX(-50%) scale(0);
            background: white; padding: 12px 24px; border-radius: 25px; font-weight: bold; white-space: nowrap;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); pointer-events: none; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 250;
            max-width: 250px; white-space: normal; text-align: center; line-height: 1.2;
        }
        #bubble::after { content:''; position: absolute; bottom:-10px; left:50%; transform:translateX(-50%); border:10px solid transparent; border-top-color:white; }

        /* GAME OVER */
        #game-over-screen {
            position: fixed; inset: 0; background: black; z-index: 1000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: red; font-family: 'Noto Sans TC', sans-serif;
        }
        .go-text { font-size: 60px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 20px red; animation: pulse 1s infinite; }
        @keyframes pulse { 0%{opacity:0.8} 50%{opacity:1} 100%{opacity:0.8} }
        .restart-btn { margin-top: 20px; padding: 10px 30px; border: 2px solid white; background: transparent; color: white; font-size: 20px; cursor: pointer; }

        /* 設定頁 */
        #setup { position: fixed; inset: 0; background: #222; z-index: 999; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .setup-card { background: #333; padding: 20px; border-radius: 15px; width: 100%; max-width: 320px; margin-bottom: 15px; color: white; text-align: center; }
        input[type="text"] { width: 90%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; font-size:16px; }
        .btn-start { width:200px; padding:15px; border-radius:30px; border:none; background:var(--primary); font-weight:bold; font-size:18px; cursor:pointer; margin-top:10px; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="game-over-screen">
        <div class="go-text">YOU DIED</div>
        <div style="color: white; margin-top: 10px;">JENNIFER HATES THAT.</div>
        <button class="restart-btn" onclick="location.reload()">TRY AGAIN</button>
    </div>

    <div id="setup">
        <h1 style="color:white; font-family:'Fredoka'">JENNIFER v16</h1>
        
        <div class="setup-card" onclick="document.getElementById('file').click()">
            <img id="prev-img" style="width:100px; height:100px; border-radius:50%; object-fit:cover; display:none; margin:0 auto; border: 3px solid white;">
            <div id="cam-txt" style="font-size:40px; line-height:100px;">📷</div>
            <div style="font-size:12px; color:#aaa;">Upload Face</div>
        </div>
        <input type="file" id="file" hidden accept="image/*">

        <div class="setup-card">
            <label>Student Name</label>
            <input type="text" id="p-name" value="Tom" placeholder="Name">
        </div>

        <div class="setup-card" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="text-align:left;">
                <strong style="color:var(--danger)">JENNIFER MODE</strong>
                <div style="font-size:10px; color:#aaa">Strict Teacher (English)</div>
            </div>
            <input type="checkbox" id="mode-sw" style="width:25px; height:25px;">
        </div>

        <button class="btn-start" onclick="startGame()">START GAME</button>
    </div>

    <div id="stage" class="bg-livingroom">
        
        <div id="status-panel">
            <div class="bar-box">
                <span class="icon">🍔</span><div class="progress-track"><div id="bar-hunger" class="progress-fill" style="background:#ffaa00; width:100%"></div></div>
            </div>
            <div class="bar-box">
                <span class="icon">🧼</span><div class="progress-track"><div id="bar-clean" class="progress-fill" style="background:#00ccff; width:100%"></div></div>
            </div>
            <div class="bar-box">
                <span class="icon">⚡</span><div class="progress-track"><div id="bar-energy" class="progress-fill" style="background:#cc00ff; width:100%"></div></div>
            </div>
            <button onclick="changeScene()" style="margin-top:5px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3); color:white; border-radius:20px; font-size:10px; padding:5px; width:100%; cursor: pointer;">🏞️ CHANGE SCENE</button>
        </div>

        <div id="pet-container">
            <div id="bubble"></div>
            <div id="flies-zone"></div>
            <img id="pet-img">
        </div>

        <div id="active-tool">🍔</div>

        <div class="dock">
            <button class="dock-btn" onmousedown="spawnTool('food')" ontouchstart="spawnTool('food')">🍔</button>
            <button class="dock-btn" onmousedown="spawnTool('soap')" ontouchstart="spawnTool('soap')">🧼</button>
            <button class="dock-btn" onmousedown="spawnTool('bed')" ontouchstart="spawnTool('bed')">🛏️</button>
            <button class="dock-btn" onmousedown="spawnTool('phone')" ontouchstart="spawnTool('phone')" style="background:#fff9c4">📱</button>
        </div>
    </div>

    <script>
        // --- 變數 ---
        let isJennifer = false;
        let isSad = false; 
        let isGameOver = false;
        let playerName = "Tom";
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let stats = { hunger: 80, clean: 80, energy: 80 };
        let poopCount = 0;
        let px = window.innerWidth/2, py = window.innerHeight - 250;
        let vx = 0, vy = 0;
        let isDraggingPet = false, lastX, lastY;
        let currentTool = null, isToolDragging = false;
        let draggingPoopEl = null, poopOffX = 0, poopOffY = 0, poopClickTime = 0;
        let speakTimeout;

        const scenes = ['bg-livingroom', 'bg-park', 'bg-class'];
        let sceneIdx = 0;

        // --- 3 & 4. 對話庫 (Expanded Dialogues) ---
        const dialogues = {
            normal: {
                touch: ["Hehe!", "That tickles!", "I love you!", "Yay!", "More!", "Hahaha!", "You're my friend!"],
                drag: ["Weeee!", "Flying!", "Higher!", "Whoa!", "I believe I can fly!"],
                drop: ["Ouch!", "My bum!", "That hurt!", "Be careful!", "Again!"],
                food: ["Yummy!", "Delicious!", "My favorite!", "Nom nom!", "Tasty!"],
                soap: ["So fresh!", "Bubbles!", "Clean clean!", "Smells good!", "Sparkling!"],
                bed: ["Good night...", "Sleepy...", "Zzz...", "Sweet dreams...", "Nap time..."],
                phone: ["Say cheese!", "Selfie!", "Look at me!", "Picture time!", "Click!"],
                clean_poop: ["Thanks!", "Eww, it stinks!", "Bye bye poop!", "Much better!", "Phew!"],
                eat_poop_sad: ["Why...?", "Gross...", "I thought you loved me...", "Tastes bad...", "Bleh..."]
            },
            jennifer: {
                touch: ["Don't touch me!", "Do you mind?", "Personal space!", "I am your teacher, not your pet!", "Hands off!", "Detention!"],
                drag: ["UNHAND ME!", "Put me down immediately!", "This is inappropriate behavior!", "I will call your parents!", "STOP IT!"],
                drop: ["How dare you!", "Sit properly!", "That is a demerit!", "You are in big trouble!", "Behave yourself!"],
                food: ["No eating in class!", "Put that away!", "Is that gum?", "Did you bring enough for everyone?", "Not now!"],
                soap: ["I prefer my natural scent!", "Water is for the weak!", "Get that away from me!", "I don't need a bath!", "Leave me alone!"], // 9. 拒絕洗澡
                bed: ["No sleeping in my class!", "Wake up!", "Pay attention!", "Eyes on the board!", "Stand up!"],
                phone: ["No phones allowed!", "Confiscated!", "Give me that!", "Are you texting?", "Focus on the lesson!"], // 2. 手機罵人
                clean_poop: ["Finally.", "Wash your hands.", "Disgusting habit.", "About time.", "Don't make a mess."],
                eat_poop_anger: ["HOW DARE YOU!", "VILE CHILD!", "ABSOLUTELY NOT!", "YOU ARE EXPELLED!", "THIS IS WAR!"]
            }
        };

        function getRandomText(category) {
            const mode = isJennifer ? 'jennifer' : 'normal';
            const list = dialogues[mode][category];
            return list[Math.floor(Math.random() * list.length)];
        }

        // --- 初始化 ---
        document.getElementById('file').addEventListener('change', async (e) => {
            const f = e.target.files[0];
            if(!f) return;
            const url = URL.createObjectURL(f);
            document.getElementById('prev-img').src = url;
            document.getElementById('prev-img').style.display = 'block';
            document.getElementById('cam-txt').style.display = 'none';
            try {
                const blob = await imglyRemoveBackground(f, {publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.3.0/dist/"});
                document.getElementById('pet-img').src = URL.createObjectURL(blob);
            } catch(e) { document.getElementById('pet-img').src = url; }
        });

        function startGame() {
            playerName = document.getElementById('p-name').value || "Student";
            isJennifer = document.getElementById('mode-sw').checked;
            document.getElementById('setup').style.display = 'none';
            if(audioCtx.state === 'suspended') audioCtx.resume();

            if(isJennifer) {
                document.getElementById('stage').className = 'bg-class';
                speak("Class is in session. Sit down.");
            } else {
                speak("Hi " + playerName + "! Let's play!");
            }
            
            requestAnimationFrame(physicsLoop);
            setInterval(survivalLoop, 2000);
            
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, {passive:false});
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchend', onUp);
        }

        // --- 物理 ---
        const petC = document.getElementById('pet-container');
        const petImg = document.getElementById('pet-img');
        petC.addEventListener('mousedown', startDragPet);
        petC.addEventListener('touchstart', startDragPet, {passive:false});

        function startDragPet(e) {
            if(isToolDragging || draggingPoopEl || isGameOver) return;
            e.preventDefault();
            isDraggingPet = true;
            vx = 0; vy = 0;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            lastX = cx; lastY = cy;
            petC.style.cursor = 'grabbing';
            petImg.style.transform = 'scale(1.1)';
            speak(getRandomText('drag'));
        }

        function physicsLoop() {
            if(isGameOver) return;

            if(!isDraggingPet) {
                vy += 0.8; // 重力
                px += vx; py += vy;

                // 7. 防飛出邊界 (天花板)
                if(py < -100) { py = -100; vy = -vy * 0.5; } 

                // 地板
                const floorY = window.innerHeight - 180;
                if(py > floorY) {
                    py = floorY; vy = -vy * 0.4; vx *= 0.8;
                    if(Math.abs(vy) < 1) vy = 0;
                }
                // 牆壁
                if(px < 50) { px = 50; vx = -vx * 0.6; }
                if(px > window.innerWidth - 50) { px = window.innerWidth - 50; vx = -vx * 0.6; }

                petC.style.left = px + 'px'; petC.style.top = py + 'px';
                
                if(py < floorY - 10) petImg.style.transform = `rotate(${vx * 2}deg)`;
                else petImg.style.transform = `rotate(0deg)`;

                // 7. 移動軌跡 (當速度夠快時)
                if(Math.abs(vx) > 5 || Math.abs(vy) > 5) {
                    createTrail(px, py);
                }
            }
            requestAnimationFrame(physicsLoop);
        }

        // 7. 軌跡生成
        function createTrail(x, y) {
            if(Math.random() > 0.3) return; // 不要太頻繁
            const dot = document.createElement('div');
            dot.className = 'trail-dot';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            document.getElementById('stage').appendChild(dot);
            setTimeout(() => dot.remove(), 800);
        }

        // 5. 點擊反饋
        petC.addEventListener('click', () => {
            if(isDraggingPet || isGameOver) return;
            // 簡單判斷：如果移動很小就算點擊
            if(Math.abs(vx) < 2 && Math.abs(vy) < 2) {
                if(isJennifer) {
                    speak(getRandomText('touch'));
                    playSound('bad');
                    createParticles(px, py, '💢'); // 憤怒符號
                } else {
                    stats.energy = Math.min(100, stats.energy + 5);
                    speak(getRandomText('touch'));
                    playSound('pop');
                    createParticles(px, py, '❤️'); // 愛心
                    updateBars();
                    
                    if(isSad) { isSad = false; petImg.classList.remove('sad'); }
                }
            }
        });

        // --- 屎系統 ---
        function spawnPoop() {
            if(isGameOver) return;
            const p = document.createElement('div');
            p.innerText = "💩"; p.className = 'poop';
            const ry = window.innerHeight - 100 - Math.random()*80; 
            const rx = Math.random() * (window.innerWidth - 80) + 40;
            p.style.left = rx + 'px'; p.style.top = ry + 'px';
            p.addEventListener('mousedown', (e) => startDragPoop(e, p));
            p.addEventListener('touchstart', (e) => startDragPoop(e, p), {passive:false});
            document.body.appendChild(p);
            poopCount++;
            playSound('fart');
        }

        function startDragPoop(e, el) {
            if(isGameOver) return;
            e.stopPropagation(); e.preventDefault();
            draggingPoopEl = el;
            poopClickTime = Date.now();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = el.getBoundingClientRect();
            poopOffX = cx - rect.left; poopOffY = cy - rect.top;
            el.style.zIndex = 999; el.style.transform = "scale(1.3)";
        }

        // --- 互動邏輯 ---
        function onMove(e) {
            if(isGameOver) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;

            if(isDraggingPet) {
                e.preventDefault();
                vx = (cx - lastX) * 1.2; vy = (cy - lastY) * 1.2;
                px = cx; py = cy; lastX = cx; lastY = cy;
                petC.style.left = px + 'px'; petC.style.top = py + 'px';
            } else if(isToolDragging) {
                const toolEl = document.getElementById('active-tool');
                toolEl.style.left = cx + 'px'; toolEl.style.top = cy + 'px';
            } else if(draggingPoopEl) {
                e.preventDefault();
                draggingPoopEl.style.left = (cx - poopOffX) + 'px';
                draggingPoopEl.style.top = (cy - poopOffY) + 'px';
            }
        }

        function onUp(e) {
            if(isGameOver) return;
            const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

            if(isDraggingPet) { 
                isDraggingPet = false; petC.style.cursor = 'grab'; 
                petImg.style.transform = 'scale(1)'; 
                if(Math.abs(vx) > 10) speak(getRandomText('drop')); // 拋出去說話
            }
            
            if(isToolDragging) {
                isToolDragging = false;
                document.getElementById('active-tool').style.display = 'none';
                if(checkHit(cx, cy)) applyTool(currentTool);
                currentTool = null;
            }

            if(draggingPoopEl) {
                const el = draggingPoopEl; draggingPoopEl = null;
                el.style.zIndex = 100; el.style.transform = "scale(1)";
                const timeDiff = Date.now() - poopClickTime;
                
                if(timeDiff < 200) cleanPoop(el); 
                else {
                    if(checkHit(cx, cy)) forceFeedPoop(el); 
                    else fallPoop(el); 
                }
            }
        }

        function checkHit(x, y) {
            const rect = petC.getBoundingClientRect();
            return (x > rect.left && x < rect.right && y > rect.top && y < rect.bottom);
        }

        // --- 11. 恐怖餵屎結局邏輯 ---
        function forceFeedPoop(el) {
            el.remove();
            poopCount = Math.max(0, poopCount-1);
            
            if(isJennifer) {
                // 延遲恐怖攻擊
                isGameOver = true;
                petImg.classList.add('sick'); // 先變綠
                speak(getRandomText('eat_poop_anger'));
                playSound('bad');

                // 1秒後恐怖攻擊
                setTimeout(() => {
                   petImg.classList.remove('sick');
                   petImg.classList.add('attack'); // 衝過來
                   playSound('scream');
                   
                   // 再過0.5秒黑屏
                   setTimeout(() => {
                        document.getElementById('game-over-screen').style.display = 'flex';
                        document.querySelector('.dock').style.display = 'none';
                        document.getElementById('status-panel').style.display = 'none';
                   }, 400);
                }, 1500);

            } else {
                isSad = true;
                petImg.classList.add('sad');
                speak(getRandomText('eat_poop_sad'));
                playSound('bad');
                stats.clean = 0;
                stats.hunger = 100; 
                updateBars();
            }
        }

        function cleanPoop(el) {
            playSound('clean');
            el.style.transition = "0.5s"; el.style.transform = "translateY(-50px) scale(0)";
            setTimeout(() => el.remove(), 500);
            poopCount = Math.max(0, poopCount-1);
            stats.clean += 10;
            speak(getRandomText('clean_poop'));
            updateBars();
        }

        function fallPoop(el) {
            el.style.transition = "top 0.5s ease-in";
            el.style.top = (window.innerHeight - 150) + 'px';
            setTimeout(() => el.style.transition = "none", 500);
        }

        // --- 道具效果 ---
        function spawnTool(type, e) {
            if(isGameOver) return;
            if(e) e.preventDefault();
            currentTool = type; isToolDragging = true;
            const t = document.getElementById('active-tool');
            t.innerText = { food:'🍔', soap:'🧼', bed:'🛏️', phone:'📱' }[type];
            t.style.display = 'block';
            playSound('pop');
        }

        function applyTool(type) {
            if(isSad && type === 'food' && !isJennifer) {
                isSad = false; petImg.classList.remove('sad');
                speak("I forgive you!");
            }

            if(isJennifer) {
                if(type==='food') speak(getRandomText('food'));
                else if(type==='soap') { 
                    // 9. Jennifer 拒絕洗澡
                    speak(getRandomText('soap'));
                    playSound('bad');
                    // 彈開動作
                    vx = (Math.random()-0.5)*20; vy = -10;
                }
                else if(type==='phone') { speak(getRandomText('phone')); playSound('bad'); }
                else if(type==='bed') { speak(getRandomText('bed')); }
            } else {
                if(type==='food') { stats.hunger=Math.min(100, stats.hunger+30); speak(getRandomText('food')); playSound('eat'); }
                else if(type==='soap') { 
                    // 12. 洗澡泡泡聲與特效
                    stats.clean=100; speak(getRandomText('soap')); 
                    playSound('bubble'); 
                    createBubbleEffects(px, py); // 視覺泡泡
                    document.querySelectorAll('.poop').forEach(e=>e.remove()); poopCount=0; 
                }
                else if(type==='phone') { 
                    // 2. 拍照功能
                    takePhoto();
                }
                else if(type==='bed') { speak(getRandomText('bed')); }
            }
            updateBars();
        }

        // 2. 拍照功能實現
        function takePhoto() {
            playSound('shutter');
            speak(getRandomText('phone'));
            
            // 閃光燈
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = 1;
            setTimeout(() => flash.style.opacity = 0, 100);

            // 簡單生成圖片下載 (合成背景與人物)
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = 400;
            const ctx = canvas.getContext('2d');
            
            // 畫背景顏色
            ctx.fillStyle = '#fce4ec'; 
            ctx.fillRect(0,0,400,400);
            
            // 畫文字
            ctx.fillStyle = '#333'; ctx.font = '20px Fredoka';
            ctx.fillText("My Pet " + playerName, 20, 30);
            ctx.fillText(new Date().toLocaleDateString(), 20, 380);

            // 嘗試畫圖 (因跨域問題，這裡用簡單的圓形代替示意，實際環境若圖片同源可 drawImage)
            const img = document.getElementById('pet-img');
            try {
                ctx.drawImage(img, 50, 50, 300, 300);
            } catch(e) {
                ctx.beginPath(); ctx.arc(200,200,100,0,Math.PI*2); ctx.fillStyle='#ccc'; ctx.fill();
                ctx.fillStyle='black'; ctx.fillText("Photo Saved!", 150, 200);
            }

            // 下載
            const link = document.createElement('a');
            link.download = 'pet_photo.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // 8 & 12. 泡泡特效生成
        function createBubbleEffects(x, y) {
            for(let i=0; i<10; i++) {
                const b = document.createElement('div');
                b.className = 'bubble-particle';
                const size = Math.random()*20 + 10;
                b.style.width = size+'px'; b.style.height = size+'px';
                b.style.left = (x + (Math.random()-0.5)*100) + 'px';
                b.style.top = (y + (Math.random()-0.5)*100) + 'px';
                document.getElementById('stage').appendChild(b);
                setTimeout(()=>b.remove(), 1000);
            }
        }
        
        // 5. 愛心/憤怒特效
        function createParticles(x, y, char) {
            for(let i=0; i<3; i++) {
                const p = document.createElement('div');
                p.innerText = char;
                p.style.position = 'absolute';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.fontSize = '30px'; p.style.pointerEvents = 'none';
                p.style.transition = '1s';
                p.style.zIndex = 100;
                document.getElementById('stage').appendChild(p);
                
                setTimeout(() => {
                    p.style.transform = `translate(${(Math.random()-0.5)*100}px, -100px) scale(0)`;
                    p.style.opacity = 0;
                }, 50);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function survivalLoop() {
            if(isGameOver) return;
            stats.hunger = Math.max(0, stats.hunger-1);
            stats.clean = Math.max(0, stats.clean-0.5);
            stats.energy = Math.max(0, stats.energy-0.5);
            
            if(stats.hunger > 50 && Math.random()<0.08) spawnPoop();
            
            if(stats.clean < 40 && !isSad) {
                petImg.classList.add('dirty');
                const fz = document.getElementById('flies-zone');
                if(fz.innerHTML === '') fz.innerHTML = '<div class="fly" style="top:-30px">🪰</div><div class="fly" style="left:-30px; animation-delay:0.5s">🪰</div>';
            } else {
                petImg.classList.remove('dirty');
                document.getElementById('flies-zone').innerHTML = '';
            }
            updateBars();
        }

        function updateBars() {
            document.getElementById('bar-hunger').style.width = stats.hunger+'%';
            document.getElementById('bar-clean').style.width = stats.clean+'%';
            document.getElementById('bar-energy').style.width = stats.energy+'%';
        }

        // 10. 說話停留久一點
        function speak(text) {
            const b = document.getElementById('bubble');
            b.innerText = text; b.style.transform = "translateX(-50%) scale(1)";
            b.style.color = isJennifer ? "red" : "black";
            
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            // 6. 確保 Jennifer 說英文
            u.lang = isJennifer ? 'en-US' : 'zh-HK';
            u.rate = 1.0;
            window.speechSynthesis.speak(u);
            
            clearTimeout(speakTimeout);
            speakTimeout = setTimeout(()=>b.style.transform="translateX(-50%) scale(0)", 4000); // 4秒
        }
        
        function changeScene() {
            if(isGameOver) return;
            if(isJennifer) speak("Fine. Sit anywhere."); 
            sceneIdx = (sceneIdx+1)%scenes.length;
            document.getElementById('stage').className = scenes[sceneIdx];
        }

        // 12. 新增音效
        function playSound(t) {
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if(t==='pop') { 
                osc.frequency.setValueAtTime(600,now); osc.frequency.exponentialRampToValueAtTime(1200,now+0.1); 
                g.gain.setValueAtTime(0.1,now); g.gain.linearRampToValueAtTime(0,now+0.1);
                osc.start(now); osc.stop(now+0.1);
            }
            else if(t==='bubble') { // 泡泡聲
                osc.type='triangle';
                osc.frequency.setValueAtTime(300,now); osc.frequency.linearRampToValueAtTime(600,now+0.1);
                g.gain.setValueAtTime(0.1,now); g.gain.linearRampToValueAtTime(0,now+0.2);
                osc.start(now); osc.stop(now+0.2);
            }
            else if(t==='shutter') { // 快門聲 (噪音模擬)
                osc.type='square'; osc.frequency.setValueAtTime(1000,now);
                g.gain.setValueAtTime(0.1,now); g.gain.linearRampToValueAtTime(0,now+0.05);
                osc.start(now); osc.stop(now+0.05);
            }
            else if(t==='fart') { 
                osc.type='sawtooth'; osc.frequency.setValueAtTime(150,now); osc.frequency.linearRampToValueAtTime(50,now+0.4); 
                g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0,now+0.4);
                osc.start(now); osc.stop(now+0.4);
            }
            else if(t==='scream') { // 恐怖尖叫
                osc.type='sawtooth'; 
                osc.frequency.setValueAtTime(400,now); 
                osc.frequency.linearRampToValueAtTime(1500,now+0.2); 
                osc.frequency.linearRampToValueAtTime(100,now+0.5);
                g.gain.setValueAtTime(0.5,now); g.gain.linearRampToValueAtTime(0,now+0.5);
                osc.start(now); osc.stop(now+0.5);
            }
            else if(t==='bad') { 
                osc.type='square'; osc.frequency.setValueAtTime(150,now); osc.frequency.linearRampToValueAtTime(100,now+0.3); 
                g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0,now+0.3);
                osc.start(now); osc.stop(now+0.3);
            }
            else if(t==='eat') {
                osc.frequency.setValueAtTime(300,now); osc.frequency.linearRampToValueAtTime(200,now+0.1);
                g.gain.setValueAtTime(0.1,now); g.gain.linearRampToValueAtTime(0,now+0.1);
                osc.start(now); osc.stop(now+0.1);
            }
        }
    </script>
</body>
