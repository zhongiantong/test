<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNIFER PROTOCOL - Manual Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/imgly-background-removal.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-red: #ff0055;
            --glass-bg: rgba(20, 20, 30, 0.8);
            --border-color: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; background: #050505; color: white;
            font-family: 'Rajdhani', 'Noto Sans TC', sans-serif;
            overflow: hidden; user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%);
        }

        /* --- 設定層 UI --- */
        #setup-layer {
            position: fixed; inset: 0; z-index: 999;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; overflow-y: auto;
            background: url('https://img.freepik.com/free-vector/dark-hexagonal-background-with-gradient-color_79603-1409.jpg') center/cover;
            transition: 0.5s;
        }
        /* 當開啟 Jennifer 模式時，設定背景變紅 */
        #setup-layer.mode-active {
            background-image: linear-gradient(rgba(50,0,0,0.8), rgba(50,0,0,0.8)), url('https://img.freepik.com/free-vector/dark-hexagonal-background-with-gradient-color_79603-1409.jpg');
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            width: 100%; max-width: 320px; padding: 25px; margin-bottom: 20px;
            text-align: center;
        }

        h1 { color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); margin-bottom: 5px; letter-spacing: 2px; }
        p { color: #888; font-size: 12px; margin-bottom: 20px; letter-spacing: 1px; }

        /* 頭像預覽 */
        .avatar-preview {
            width: 120px; height: 120px; border-radius: 50%;
            background: #111; margin: 0 auto 20px;
            border: 3px solid #333; overflow: hidden; position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-preview.processing::after {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.5);
            border: 2px dashed white; border-radius: 50%;
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 上傳按鈕 */
        .btn-upload {
            background: #333; color: white; border: 1px solid #555;
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
            font-size: 14px; font-weight: bold; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-upload:hover { background: #444; border-color: #888; }

        /* --- 核心開關 (Jennifer Mode Switch) --- */
        .mode-switch-container {
            margin-top: 30px;
            padding: 15px; border-radius: 15px;
            background: rgba(0,0,0,0.3); border: 1px solid #333;
            display: flex; align-items: center; justify-content: space-between;
        }
        .switch-label { text-align: left; }
        .switch-title { font-size: 14px; font-weight: bold; color: white; display: block;}
        .switch-desc { font-size: 10px; color: #777; }
        
        /* Toggle CSS */
        .toggle-checkbox { display: none; }
        .toggle-slot {
            position: relative; height: 26px; width: 50px;
            border: 2px solid #444; border-radius: 20px; background: #111;
            transition: 0.3s; cursor: pointer;
        }
        .toggle-button {
            position: absolute; top: 3px; left: 3px;
            width: 20px; height: 20px; border-radius: 50%; background: #666;
            transition: 0.3s; box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        /* 啟動狀態 */
        .toggle-checkbox:checked + .toggle-slot { background: #3a0000; border-color: var(--neon-red); }
        .toggle-checkbox:checked + .toggle-slot .toggle-button {
            background: var(--neon-red); transform: translateX(24px);
            box-shadow: 0 0 10px var(--neon-red);
        }

        /* 開始按鈕 */
        .btn-start {
            width: 100%; padding: 15px; margin-top: 20px;
            background: linear-gradient(45deg, #007bff, #00c6ff);
            border: none; border-radius: 50px; color: white;
            font-size: 18px; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 0 20px rgba(0, 123, 255, 0.4);
            transition: 0.3s;
        }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        /* Jennifer 模式下的按鈕樣式 */
        .btn-start.danger-mode {
            background: linear-gradient(45deg, #b71c1c, #ff0055);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        /* --- 遊戲畫面 --- */
        #game-wrapper {
            position: relative; width: 100vw; height: 100vh;
            background-size: cover; background-position: center;
            transition: 1s;
        }
        
        .scene-normal { background: linear-gradient(180deg, #89f7fe 0%, #66a6ff 100%); }
        .scene-teacher { 
            background: linear-gradient(180deg, #2b0505 0%, #4a0e0e 100%);
            box-shadow: inset 0 0 100px black;
        }

        /* 警告浮水印 */
        #warning-overlay {
            position: absolute; inset: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.5s;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,0,0,0.05) 10px, rgba(255,0,0,0.05) 20px);
        }
        .scene-teacher #warning-overlay { opacity: 1; }
        .warning-text {
            font-size: 40px; font-weight: 800; color: rgba(255, 0, 0, 0.15);
            border: 8px solid rgba(255,0,0,0.15); padding: 20px 40px;
            transform: rotate(-15deg); letter-spacing: 5px;
        }

        /* 狀態與按鈕 */
        .top-ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10; }
        .stat-pill { background: rgba(255,255,255,0.8); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        #pet-container {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; height: 280px; z-index: 5;
        }
        #pet-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); transition: 0.3s; }

        #bubble {
            position: absolute; top: -80px; left: 50%; transform: translateX(-50%) scale(0);
            background: white; padding: 15px 25px; border-radius: 20px 20px 20px 0;
            font-weight: bold; color: #333; min-width: 100px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.25); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 50px; display: flex; gap: 15px;
            border: 1px solid rgba(255,255,255,0.3); z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .dock-btn {
            width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 26px;
            cursor: pointer; background: white; transition: 0.2s; box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        .dock-btn:active { transform: scale(0.9); }

        /* Loader */
        .loading-text { font-size: 12px; color: #00f3ff; margin-top: 10px; display:none; }

    </style>
</head>
<body>

    <div id="setup-layer">
        <h1>MANUAL CONTROL</h1>
        <p>UPLOAD & SELECT IDENTITY PROTOCOL</p>

        <div class="glass-panel">
            <div class="avatar-preview" id="preview-box">
                <img id="preview-img" style="display:none">
                <span id="placeholder-icon" style="font-size:40px; color:#555;">📷</span>
            </div>
            
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">
                📂 上傳照片 (Remove BG)
            </button>
            <input type="file" id="file-input" accept="image/*" style="display:none">
            
            <div id="loading-txt" class="loading-text">REMOVING BACKGROUND...</div>

            <div style="margin-top:20px;">
                <input type="text" id="player-name" placeholder="輸入名字..." 
                       style="width:80%; padding:10px; border-radius:5px; border:1px solid #555; background:#222; color:white; text-align:center;">
            </div>

            <div class="mode-switch-container">
                <div class="switch-label">
                    <span class="switch-title" id="mode-title-text">普通模式</span>
                    <span class="switch-desc">Normal Student</span>
                </div>
                <label>
                    <input type="checkbox" id="jennifer-toggle" class="toggle-checkbox" onchange="toggleModeUI()">
                    <div class="toggle-slot">
                        <div class="toggle-button"></div>
                    </div>
                </label>
            </div>
        </div>

        <button id="start-btn" class="btn-start" onclick="startGame()" disabled>
            ENTER SYSTEM
        </button>
    </div>

    <div id="game-wrapper" class="scene-normal">
        <div id="warning-overlay">
            <div class="warning-text">NO PHONES ALLOWED</div>
        </div>

        <div class="top-ui">
            <div class="stat-pill" style="color:#ff9f43">🍖 <span id="val-hunger">80</span></div>
            <div class="stat-pill" style="color:#48dbfb">🚿 <span id="val-clean">80</span></div>
            <div class="stat-pill" style="color:#ff6b6b">😊 <span id="val-fun">80</span></div>
        </div>

        <div id="pet-container">
            <div id="bubble"></div>
            <img id="pet-img" src="">
        </div>

        <div class="dock">
            <button class="dock-btn" onclick="act('feed')">🍱</button>
            <button class="dock-btn" onclick="act('clean')">🧹</button>
            <button class="dock-btn" onclick="act('sleep')">💤</button>
            <button class="dock-btn" onclick="act('phone')" style="background:#ffeaa7">📱</button>
        </div>
    </div>

    <script>
        const state = {
            hunger: 80, clean: 80, fun: 80,
            isJennifer: false, // 核心變數：是否為老師模式
            isSleeping: false
        };

        // --- 1. 介面邏輯 ---
        
        // 切換開關時的 UI 變化
        function toggleModeUI() {
            const isChecked = document.getElementById('jennifer-toggle').checked;
            const title = document.getElementById('mode-title-text');
            const bg = document.getElementById('setup-layer');
            const btn = document.getElementById('start-btn');
            const desc = document.querySelector('.switch-desc');

            if (isChecked) {
                // Jennifer 模式
                title.innerText = "⚠ JENNIFER MODE";
                title.style.color = "#ff0055";
                desc.innerText = "Teacher / Angry / Strict";
                bg.classList.add('mode-active');
                btn.classList.add('danger-mode');
                btn.innerText = "⚠ ACTIVATE PROTOCOL";
            } else {
                // 普通模式
                title.innerText = "普通模式";
                title.style.color = "white";
                desc.innerText = "Normal Student";
                bg.classList.remove('mode-active');
                btn.classList.remove('danger-mode');
                btn.innerText = "ENTER SYSTEM";
            }
        }

        // 圖片上傳與自動去背
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // UI 更新
            const previewBox = document.getElementById('preview-box');
            const loadingTxt = document.getElementById('loading-txt');
            const startBtn = document.getElementById('start-btn');
            
            previewBox.classList.add('processing');
            loadingTxt.style.display = 'block';
            startBtn.disabled = true;

            try {
                // 1. 先顯示原圖 (以防去背太久)
                const tempUrl = URL.createObjectURL(file);
                document.getElementById('preview-img').src = tempUrl;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('placeholder-icon').style.display = 'none';

                // 2. 執行去背
                const config = { publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.3.0/dist/" };
                const blob = await imglyRemoveBackground(file, config);
                const finalUrl = URL.createObjectURL(blob);
                
                // 3. 完成
                document.getElementById('preview-img').src = finalUrl; // 更新預覽
                document.getElementById('pet-img').src = finalUrl;     // 更新遊戲內圖片
                
            } catch (err) {
                console.error("BG Removal failed, using original", err);
                document.getElementById('pet-img').src = URL.createObjectURL(file);
            }

            previewBox.classList.remove('processing');
            loadingTxt.style.display = 'none';
            startBtn.disabled = false;
        });

        // --- 2. 遊戲開始 ---
        function startGame() {
            const name = document.getElementById('player-name').value || "同學";
            state.isJennifer = document.getElementById('jennifer-toggle').checked;

            document.getElementById('setup-layer').style.display = 'none';
            
            if (state.isJennifer) {
                document.getElementById('game-wrapper').className = "scene-teacher";
                talk(`I see you, ${name}.`, true);
            } else {
                document.getElementById('game-wrapper').className = "scene-normal";
                talk(`嗨 ${name}！一起玩吧！`);
            }

            setInterval(gameLoop, 2000);
        }

        // --- 3. 遊戲循環 ---
        function gameLoop() {
            if (state.isSleeping) return;

            state.hunger = Math.max(0, state.hunger - 2);
            state.clean = Math.max(0, state.clean - 1);
            state.fun = Math.max(0, state.fun - 2);

            // 更新數值 UI
            document.getElementById('val-hunger').innerText = state.hunger;
            document.getElementById('val-clean').innerText = state.clean;
            document.getElementById('val-fun').innerText = state.fun;

            // Jennifer 隨機碎念
            if (state.isJennifer && Math.random() < 0.1) {
                const lines = ["Eyes front.", "Is that gum?", "Pay attention."];
                talk(lines[Math.floor(Math.random() * lines.length)], true);
            }
        }

        // --- 4. 互動邏輯 ---
        function act(type) {
            if (type === 'phone') {
                if (state.isJennifer) {
                    // Jennifer 模式下玩手機：暴怒
                    talk("GIVE ME YOUR PHONE! NOW!", true);
                    state.fun -= 20;
                    // 震動特效
                    const img = document.getElementById('pet-img');
                    img.style.transform = "translate(-50%, -50%) scale(1.3) rotate(5deg)";
                    setTimeout(() => img.style.transform = "translate(-50%, -50%) scale(1)", 300);
                } else {
                    talk("耶！打遊戲！");
                    state.fun = Math.min(100, state.fun + 15);
                }
            } 
            else if (type === 'feed') {
                if(state.isJennifer) talk("No eating in class.", true);
                else { talk("好吃！"); state.hunger += 20; }
            }
            else if (type === 'clean') {
                if(state.isJennifer) talk("Detention.");
                else { talk("洗香香～"); state.clean += 20; }
            }
            else if (type === 'sleep') {
                state.isSleeping = !state.isSleeping;
                const wrapper = document.getElementById('game-wrapper');
                if(state.isSleeping) {
                    wrapper.style.filter = "brightness(0.2)";
                    talk(state.isJennifer ? "Class dismissed." : "晚安 zzz");
                } else {
                    wrapper.style.filter = "brightness(1)";
                    talk("早安！");
                }
            }
            // 每次操作後刷新數值
            document.getElementById('val-hunger').innerText = state.hunger;
            document.getElementById('val-clean').innerText = state.clean;
            document.getElementById('val-fun').innerText = state.fun;
        }

        // --- 5. 對話系統 ---
        function talk(text, isAngry = false) {
            const b = document.getElementById('bubble');
            b.innerText = text;
            b.style.transform = "translateX(-50%) scale(1)";
            
            // 樣式
            if (isAngry) {
                b.style.border = "2px solid red";
                b.style.color = "#d60000";
                b.style.background = "#fff0f0";
            } else {
                b.style.border = "none";
                b.style.color = "#333";
                b.style.background = "white";
            }

            // 語音合成
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                if (state.isJennifer) {
                    u.lang = 'en-US'; u.pitch = 0.7; u.rate = 1.2; // 老師語氣
                } else {
                    u.lang = 'zh-HK'; u.pitch = 1.2; // 學生語氣
                }
                window.speechSynthesis.speak(u);
            }

            setTimeout(() => {
                b.style.transform = "translateX(-50%) scale(0)";
            }, 2500);
        }
    </script>
</body>
</html>
