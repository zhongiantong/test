<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNIFER PROTOCOL v7.0 - AUDIO ENHANCED</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/imgly-background-removal.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+TC:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f3ff;
            --danger: #ff003c;
            --bg-dark: #050505;
        }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden; user-select: none;
            touch-action: manipulation;
        }

        /* --- 動畫特效 --- */
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        @keyframes red-flash { 0% { box-shadow: inset 0 0 0 transparent; } 50% { box-shadow: inset 0 0 100px var(--danger); } 100% { box-shadow: inset 0 0 0 transparent; } }
        @keyframes particle-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }

        /* --- 設定層 --- */
        #setup-layer {
            position: fixed; inset: 0; z-index: 999;
            background: linear-gradient(135deg, #111, #222);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.5s;
        }
        #setup-layer.jennifer-bg { background: linear-gradient(135deg, #2b0505, #000); }

        .title { font-family: 'Black Ops One', cursive; font-size: 40px; color: var(--primary); text-shadow: 0 0 20px var(--primary); margin-bottom: 20px; text-align: center; }
        .subtitle { color: #888; font-size: 12px; letter-spacing: 2px; margin-top: -15px; margin-bottom: 30px; }

        .upload-box {
            width: 150px; height: 150px; border-radius: 50%;
            border: 2px dashed #555; display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: #000; position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; }
        .upload-box.done { border: 2px solid var(--primary); box-shadow: 0 0 20px var(--primary); }

        /* --- 開關設計 --- */
        .toggle-wrapper {
            margin: 30px 0; background: rgba(255,255,255,0.1); padding: 10px 20px;
            border-radius: 50px; display: flex; align-items: center; gap: 15px; border: 1px solid #444;
        }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--danger); }
        input:checked + .slider:before { transform: translateX(26px); }

        .btn-start {
            background: var(--primary); color: black; font-weight: 900;
            padding: 15px 40px; border-radius: 50px; border: none; font-size: 20px;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: 0.2s; opacity: 0.5; pointer-events: none;
        }
        .btn-start.ready { opacity: 1; pointer-events: all; }
        .btn-start:active { transform: scale(0.95); }

        /* --- 遊戲主畫面 --- */
        #game-stage {
            position: fixed; inset: 0; background-size: cover; background-position: center;
            transition: filter 0.5s; overflow: hidden;
        }
        .bg-normal { background: linear-gradient(to bottom, #a18cd1 0%, #fbc2eb 100%); }
        .bg-jennifer { background: linear-gradient(to bottom, #200122, #6f0000); box-shadow: inset 0 0 200px rgba(0,0,0,0.9); }
        
        .shake-screen { animation: shake 0.5s; }
        .flash-screen { animation: red-flash 0.5s; }

        #pet-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 300px; cursor: pointer;
            animation: float 3s ease-in-out infinite; z-index: 10;
        }
        /* 強制圓形剪裁 */
        #pet-img { 
            width: 100%; height: 100%; object-fit: cover; 
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.2);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: transform 0.1s;
        }
        #pet-wrapper:active #pet-img { transform: scale(0.95); }

        #bubble {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%) scale(0);
            background: white; color: #333; padding: 15px 25px; border-radius: 20px;
            font-size: 16px; font-weight: bold; white-space: nowrap; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        #bubble:after { content:''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border: 10px solid transparent; border-top-color: white; }
        
        .hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; gap: 10px; justify-content: center; }
        .bar-box { background: rgba(0,0,0,0.5); border-radius: 10px; padding: 5px 10px; display: flex; align-items: center; gap: 5px; color: white; font-size: 12px; backdrop-filter: blur(5px); }
        .bar { width: 50px; height: 6px; background: #555; border-radius: 3px; overflow: hidden; }
        .fill { height: 100%; width: 100%; transition: width 0.3s; }

        .controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; gap: 20px;
        }
        .c-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            font-size: 28px; background: rgba(255,255,255,0.9); cursor: pointer;
            box-shadow: 0 5px 0 #ccc, 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.1s; position: relative;
        }
        .c-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #ccc; }

        .particle { position: absolute; font-size: 24px; pointer-events: none; animation: particle-up 1s forwards; z-index: 100; }
        #loader-txt { font-size: 12px; color: var(--primary); margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="setup-layer">
        <div class="title">AI PET v7.0</div>
        <div class="subtitle">AUDIO ENHANCED SYSTEM</div>

        <div class="upload-box" id="u-box" onclick="document.getElementById('file-in').click()">
            <img id="u-preview" style="display:none">
            <span id="u-icon" style="font-size:40px; color:#555">📷</span>
        </div>
        <div id="loader-txt">REMOVING BACKGROUND (AI)...</div>
        <input type="file" id="file-in" accept="image/*" style="display:none">

        <div class="toggle-wrapper">
            <div style="text-align:right">
                <div style="font-weight:bold; font-size:14px;">JENNIFER MODE</div>
                <div style="font-size:10px; color:#aaa;">(Strict English)</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="updateTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <button id="start-btn" class="btn-start" onclick="initGame()">START</button>
    </div>

    <div id="game-stage" class="bg-normal">
        <div class="hud">
            <div class="bar-box">🍖 <div class="bar"><div id="b-hunger" class="fill" style="background:#ff9f43"></div></div></div>
            <div class="bar-box">🚿 <div class="bar"><div id="b-clean" class="fill" style="background:#48dbfb"></div></div></div>
            <div class="bar-box">😊 <div class="bar"><div id="b-fun" class="fill" style="background:#ff6b6b"></div></div></div>
        </div>

        <div id="pet-wrapper" onclick="interactPet(event)">
            <div id="bubble"></div>
            <img id="pet-img">
        </div>

        <div class="controls">
            <button class="c-btn" onclick="action('eat')">🍔</button>
            <button class="c-btn" onclick="action('clean')">🧼</button>
            <button class="c-btn" onclick="action('sleep')">💤</button>
            <button class="c-btn" onclick="action('phone')">📱</button>
        </div>
    </div>

    <script>
        // --- 全新音效合成器 (Cyber Audio Synth) ---
        // 不需要下載任何 MP3，程式碼直接產生音波
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'happy') {
                // 叮叮聲 (高頻正弦波)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } 
            else if (type === 'angry') {
                // 錯誤蜂鳴聲 (低頻鋸齒波)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            else if (type === 'ui') {
                // 按鈕點擊聲 (短促波)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        // --- 語錄資料庫 (Strict English for Jennifer) ---
        const QUOTES = {
            normal: {
                touch: ["嘻嘻！", "好痕呀～", "Hi~", "你是最好的！", "❤️"],
                eat: ["Yummy!", "好味！", "多謝款待！", "飽飽～"],
                clean: ["香噴噴！", "爽呀～", "乾淨曬！"],
                phone: ["一齊打機！", "加我好友！", "看看IG~", "自拍一張！"],
                sleep: ["晚安 zzz", "發個好夢", "不要嘈我"]
            },
            jennifer: {
                // 純英文，嚴格語氣
                touch: ["Don't touch me.", "Personal space!", "How dare you?", "Sit down.", "Excuse me?"],
                eat: ["No eating in the lab.", "Put that away.", "Is that gum?", "Disgusting."],
                clean: ["Fix your uniform.", "Tidy up.", "You look messy.", "Present yourself properly."],
                phone: ["GIVE ME YOUR PHONE!", "Confiscated.", "Detention!", "Who allowed that?", "Unbelievable."],
                sleep: ["WAKE UP!", "Eyes on me!", "No sleeping!", "Are you bored?", "Pay attention."]
            }
        };

        const state = {
            isJennifer: false,
            hunger: 80, clean: 80, fun: 80,
            isSleeping: false
        };

        function updateTheme() {
            playSound('ui');
            state.isJennifer = document.getElementById('mode-toggle').checked;
            const layer = document.getElementById('setup-layer');
            if(state.isJennifer) {
                layer.classList.add('jennifer-bg');
                document.querySelector('.title').style.color = "#ff003c";
                document.querySelector('.title').style.textShadow = "0 0 20px red";
            } else {
                layer.classList.remove('jennifer-bg');
                document.querySelector('.title').style.color = "#00f3ff";
                document.querySelector('.title').style.textShadow = "0 0 20px cyan";
            }
        }

        document.getElementById('file-in').addEventListener('change', async (e) => {
            playSound('ui');
            const file = e.target.files[0];
            if(!file) return;

            document.getElementById('u-icon').style.display = 'none';
            document.getElementById('loader-txt').style.display = 'block';
            document.getElementById('u-preview').style.display = 'block';
            document.getElementById('u-preview').src = URL.createObjectURL(file);
            
            try {
                const blob = await imglyRemoveBackground(file, {
                    publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.3.0/dist/"
                });
                const url = URL.createObjectURL(blob);
                document.getElementById('u-preview').src = url;
                document.getElementById('pet-img').src = url;
            } catch(err) {
                const url = URL.createObjectURL(file);
                document.getElementById('pet-img').src = url;
            }

            document.getElementById('loader-txt').style.display = 'none';
            document.getElementById('u-box').classList.add('done');
            document.getElementById('start-btn').classList.add('ready');
            playSound('happy'); // 成功音效
        });

        function initGame() {
            playSound('ui');
            document.getElementById('setup-layer').style.display = 'none';
            const stage = document.getElementById('game-stage');
            
            if(state.isJennifer) {
                stage.className = "bg-jennifer";
                speak("Class is in session. Silence.");
            } else {
                stage.className = "bg-normal";
                speak("Hello! 一齊玩啦！");
            }
            setInterval(loop, 2000);
        }

        function interactPet(e) {
            if(state.isSleeping) return;

            const rect = e.target.getBoundingClientRect();
            const x = e.clientX;
            const y = e.clientY;

            if(state.isJennifer) {
                // 生氣邏輯
                playSound('angry'); // 播放生氣音效
                speakRandom('touch');
                screenEffect('shake');
                spawnParticle(x, y, ['💢', '⚡', '🚫', '⚠️']);
                state.fun -= 5;
            } else {
                // 開心邏輯
                playSound('happy'); // 播放開心音效
                speakRandom('touch');
                spawnParticle(x, y, ['❤️', '✨', '🌸', '😍']);
                state.fun = Math.min(100, state.fun + 5);
            }
            updateUI();
        }

        function action(type) {
            playSound('ui'); // 按鈕聲
            if(type === 'sleep') { toggleSleep(); return; }
            if(state.isSleeping) return;

            if(state.isJennifer) {
                speakRandom(type);
                if(type === 'phone') {
                    playSound('angry'); // 嚴重錯誤音效
                    screenEffect('flash'); 
                    state.fun -= 20;
                    spawnParticle(window.innerWidth/2, window.innerHeight/2, ['🤬', '📵']);
                } else {
                    playSound('angry'); // 普通錯誤
                    spawnParticle(window.innerWidth/2, window.innerHeight/2, ['🤐', '🚫']);
                }
            } else {
                speakRandom(type);
                playSound('happy'); // 成功音效
                if(type === 'eat') state.hunger = Math.min(100, state.hunger + 20);
                if(type === 'clean') state.clean = Math.min(100, state.clean + 20);
                if(type === 'phone') state.fun = Math.min(100, state.fun + 20);
                
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                if(type==='eat') spawnParticle(centerX, centerY, ['🍔', '🍕']);
                if(type==='clean') spawnParticle(centerX, centerY, ['🧼', '✨']);
                if(type==='phone') spawnParticle(centerX, centerY, ['📱', '😆']);
            }
            updateUI();
        }

        function toggleSleep() {
            state.isSleeping = !state.isSleeping;
            const stage = document.getElementById('game-stage');
            if(state.isSleeping) {
                stage.style.filter = "brightness(0.2) grayscale(0.8)";
                speak(state.isJennifer ? "Finally." : "晚安~");
            } else {
                stage.style.filter = "none";
                speak(state.isJennifer ? "Attention." : "早安！");
            }
        }

        function speakRandom(category) {
            const list = state.isJennifer ? QUOTES.jennifer[category] : QUOTES.normal[category];
            const text = list[Math.floor(Math.random() * list.length)];
            speak(text);
        }

        function speak(text) {
            const bubble = document.getElementById('bubble');
            bubble.innerText = text;
            bubble.style.transform = "translateX(-50%) scale(1)";
            
            if(state.isJennifer) {
                bubble.style.border = "2px solid red";
                bubble.style.color = "red";
            } else {
                bubble.style.border = "none";
                bubble.style.color = "#333";
            }

            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                if(state.isJennifer) {
                    // 強制英文語音
                    u.lang = 'en-US'; 
                    u.pitch = 0.8; 
                    u.rate = 1.2; 
                } else {
                    // 廣東話語音
                    u.lang = 'zh-HK';
                    u.pitch = 1.3; 
                    u.rate = 1.1; 
                }
                window.speechSynthesis.speak(u);
            }

            setTimeout(() => bubble.style.transform = "translateX(-50%) scale(0)", 2500);
        }

        function screenEffect(type) {
            const stage = document.getElementById('game-stage');
            if(type === 'shake') {
                stage.classList.add('shake-screen');
                setTimeout(()=>stage.classList.remove('shake-screen'), 500);
            } else if (type === 'flash') {
                stage.classList.add('flash-screen');
                setTimeout(()=>stage.classList.remove('flash-screen'), 500);
            }
        }

        function spawnParticle(x, y, emojis) {
            const p = document.createElement('div');
            p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            const randX = (Math.random() - 0.5) * 50;
            p.style.transform = `translate(${randX}px, 0)`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }

        function loop() {
            if(state.isSleeping) return;
            state.hunger = Math.max(0, state.hunger - 1);
            state.clean = Math.max(0, state.clean - 0.5);
            state.fun = Math.max(0, state.fun - 1);
            updateUI();
        }

        function updateUI() {
            document.getElementById('b-hunger').style.width = state.hunger + '%';
            document.getElementById('b-clean').style.width = state.clean + '%';
            document.getElementById('b-fun').style.width = state.fun + '%';
        }
    </script>
</body>
</html>
