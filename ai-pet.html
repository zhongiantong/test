<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My AI Pet 3.0 - Identity Recognition</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/imgly-background-removal.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎 UI --- */
        body { margin: 0; background: #111; font-family: 'Fredoka', sans-serif; overflow: hidden; user-select: none; }

        /* --- 遊戲場景 --- */
        #game-wrapper {
            position: relative; width: 100vw; height: 100vh;
            transition: background 0.5s; overflow: hidden;
            background-size: cover; background-position: center;
        }

        /* 普通模式 */
        .scene-normal { background: radial-gradient(circle, #fff9c4, #ffecb3); }
        
        /* 老師模式 (高壓感) */
        .scene-teacher { 
            background: linear-gradient(180deg, #3e2723 0%, #5d4037 100%); 
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }
        .scene-teacher::before {
            content: "NO ELECTRONIC DEVICES";
            position: absolute; top: 5%; width: 100%; text-align: center;
            color: rgba(255,0,0,0.3); font-family: 'Share Tech Mono', monospace; font-size: 30px; letter-spacing: 5px; pointer-events: none;
        }

        .dark-mode { filter: brightness(0.2); }

        /* --- 頂部狀態 --- */
        .top-ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100; display: flex; flex-direction: column; gap: 5px; }
        .status-row { display: flex; gap: 5px; justify-content: center; }
        .stat-badge { background: rgba(255,255,255,0.9); padding: 5px 8px; border-radius: 15px; width: 55px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .progress-bar { width: 100%; height: 5px; background: #ddd; border-radius: 3px; margin-top: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; transition: width 0.5s; }

        /* --- 識別掃描特效 --- */
        #scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #00ff00;
            box-shadow: 0 0 10px #00ff00; opacity: 0; pointer-events: none; z-index: 50;
        }
        @keyframes scan { 0% { top: 0%; opacity: 1; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        /* --- 寵物本體 --- */
        #pet-container {
            position: absolute; left: 50%; top: 60%; width: 220px; height: 220px;
            transform: translate(-50%, -50%); z-index: 10;
            display: flex; justify-content: center; align-items: center;
        }
        #pet-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.2s; pointer-events: none; }

        /* 對話氣泡 */
        #bubble {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%) scale(0);
            background: white; padding: 15px 20px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 2px solid #333;
            font-size: 16px; color: #333; white-space: pre-wrap; text-align: center; min-width: 160px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 120;
        }
        #bubble.angry { border-color: red; background: #ffebee; color: #b71c1c; font-weight: bold; }
        #bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: inherit transparent transparent;
        }

        /* --- 底部控制台 --- */
        .dock {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 50px;
            display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 100;
        }
        .dock-btn {
            width: 55px; height: 55px; border: none; border-radius: 50%; font-size: 26px;
            cursor: pointer; background: #f0f4f8; position: relative; transition: 0.2s;
        }
        .dock-btn:active { transform: scale(0.9); }
        .dock-btn::after {
            content: attr(data-label); position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: #555; font-weight: bold; white-space: nowrap;
        }

        /* --- 設定與上傳層 (黑色風格) --- */
        #setup-layer {
            position: fixed; inset: 0; background: #1a1a1a; z-index: 999;
            display: flex; flex-direction: column; align-items: center; color: white;
            padding: 20px; overflow-y: auto;
        }
        h1 { font-family: 'Share Tech Mono', monospace; color: #00d2ff; text-shadow: 0 0 10px #00d2ff; margin-bottom: 5px; }
        
        .box { background: #333; padding: 15px; border-radius: 10px; width: 100%; max-width: 320px; margin-bottom: 15px; border: 1px solid #444; }
        .box h3 { margin: 0 0 10px 0; font-size: 14px; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #555; padding-bottom: 5px; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 5px; margin-top: 5px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
        }
        .btn-upload { background: #444; color: white; }
        .btn-start { background: linear-gradient(45deg, #00d2ff, #007bff); color: white; font-size: 18px; margin-top: 20px; display: none; }
        
        .status-txt { font-size: 12px; color: #888; margin-top: 5px; text-align: center; }
        .match-indicator { color: #ff3d00; font-weight: bold; display: none; animation: flash 1s infinite; margin-top:10px; text-align:center;}
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* 預覽頭像 */
        .preview-circle { width: 60px; height: 60px; border-radius: 50%; background: #000; overflow: hidden; margin: 0 auto; border: 2px solid #555; }
        .preview-circle img { width: 100%; height: 100%; object-fit: cover; }

        input[type="text"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #222; color: white; box-sizing: border-box;}

        /* Loader */
        .loader { width: 20px; height: 20px; border: 3px solid #fff; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; display:none;}
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="setup-layer">
        <h1>AI IDENTITY 3.0</h1>
        <p style="font-size:12px; color:#666; margin-bottom:20px;">BIO-METRIC SCANNING PROTOCOL</p>

        <div class="box">
            <h3>Step 1: Target Registration (Target)</h3>
            <p style="font-size:11px; color:#888;">上傳你要偵測的「那個人」(老師) 的照片作為比對基準。</p>
            <div class="preview-circle" id="target-preview"><img src="" style="display:none"></div>
            <button class="btn btn-upload" onclick="document.getElementById('target-input').click()">
                📂 上傳目標 (Reference)
            </button>
            <input type="file" id="target-input" accept="image/*" style="display:none">
            <div id="target-status" class="status-txt">未設定 (預設為普通模式)</div>
        </div>

        <div class="box">
            <h3>Step 2: Player Upload</h3>
            <div class="preview-circle" id="player-preview"><img src="" style="display:none"></div>
            <button class="btn btn-upload" onclick="document.getElementById('player-input').click()">
                📂 上傳遊玩照片
            </button>
            <input type="file" id="player-input" accept="image/*" style="display:none">
            <div id="player-status" class="status-txt">等待上傳...</div>
            
            <div style="margin-top:10px;">
                <label style="font-size:12px; color:#aaa;">玩家名字:</label>
                <input type="text" id="player-name" value="同學" placeholder="輸入名字">
            </div>
        </div>

        <div id="analysis-result" class="match-indicator">⚠ IDENTITY MATCHED: TEACHER DETECTED ⚠</div>

        <button id="start-btn" class="btn btn-start" onclick="startGame()">
            <span class="loader" id="start-loader"></span> 進入遊戲
        </button>

        <div id="model-status" style="position:fixed; bottom:10px; font-size:10px; color:#444;">Initialize AI Models...</div>
    </div>

    <div id="game-wrapper" class="scene-normal">
        <div id="scan-line"></div>
        
        <div class="top-ui">
            <div class="status-row">
                <div class="stat-badge">🍔 <div class="progress-bar"><div id="bar-hunger" class="progress-fill" style="background:#ff9800;"></div></div></div>
                <div class="stat-badge">🚿 <div class="progress-bar"><div id="bar-clean" class="progress-fill" style="background:#03a9f4;"></div></div></div>
                <div class="stat-badge">⚡ <div class="progress-bar"><div id="bar-energy" class="progress-fill" style="background:#ffeb3b;"></div></div></div>
                <div class="stat-badge">😊 <div class="progress-bar"><div id="bar-fun" class="progress-fill" style="background:#e91e63;"></div></div></div>
            </div>
            <div id="mode-badge" style="background:rgba(0,0,0,0.5); color:white; font-size:10px; padding:2px 5px; border-radius:5px; align-self:center;">NORMAL MODE</div>
        </div>

        <div id="pet-container">
            <div id="bubble"></div>
            <img id="pet-img" src="">
        </div>

        <div class="dock">
            <button class="dock-btn" onclick="actionFeed()" data-label="餵食">🍱</button>
            <button class="dock-btn" onclick="actionClean()" data-label="清潔">🧹</button>
            <button class="dock-btn" onclick="actionSleep()" data-label="睡覺">🔔</button>
            <button class="dock-btn" onclick="actionPlay()" data-label="手機">📱</button>
        </div>
    </div>

    <script>
        // --- 核心變數 ---
        const state = {
            hunger: 80, clean: 80, energy: 80, fun: 80,
            isSleeping: false,
            playerName: "同學",
            isTeacher: false, // 是否觸發老師模式
            targetDescriptor: null, // 目標的人臉數據
            playerDescriptor: null  // 玩家的人臉數據
        };

        const els = {
            wrapper: document.getElementById('game-wrapper'),
            img: document.getElementById('pet-img'),
            bubble: document.getElementById('bubble'),
            bars: {
                hunger: document.getElementById('bar-hunger'),
                clean: document.getElementById('bar-clean'),
                energy: document.getElementById('bar-energy'),
                fun: document.getElementById('bar-fun')
            },
            modelStatus: document.getElementById('model-status'),
            matchIndicator: document.getElementById('analysis-result')
        };

        // --- 1. 初始化 AI 模型 ---
        async function loadModels() {
            els.modelStatus.innerText = "Loading Face AI Models...";
            try {
                // 從 CDN 加載模型 (需要網路)
                await faceapi.nets.ssdMobilenetv1.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
                els.modelStatus.innerText = "AI Models Ready.";
                console.log("Models Loaded");
            } catch (e) {
                els.modelStatus.innerText = "AI Load Failed (Check Network)";
                console.error(e);
            }
        }
        loadModels();

        // --- 2. 圖片處理與識別流程 ---

        // A. 處理目標圖片 (Reference)
        document.getElementById('target-input').addEventListener('change', async (e) => {
            handleImageUpload(e.target.files[0], 'target');
        });

        // B. 處理玩家圖片 (Play)
        document.getElementById('player-input').addEventListener('change', async (e) => {
            handleImageUpload(e.target.files[0], 'player');
        });

        async function handleImageUpload(file, type) {
            if (!file) return;
            const imgUrl = URL.createObjectURL(file);
            
            // 顯示預覽
            const previewEl = document.getElementById(type + '-preview').querySelector('img');
            previewEl.src = imgUrl;
            previewEl.style.display = 'block';
            
            const statusEl = document.getElementById(type + '-status');
            statusEl.innerText = "Analyzing Face...";

            // 1. 轉成 HTMLImageElement 供 AI 分析
            const img = await faceapi.fetchImage(imgUrl);
            
            // 2. 偵測人臉並提取特徵 (Descriptor)
            const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();

            if (detection) {
                statusEl.innerText = "Face Detected ✅";
                statusEl.style.color = "#4caf50";
                
                if (type === 'target') state.targetDescriptor = detection.descriptor;
                if (type === 'player') {
                    state.playerDescriptor = detection.descriptor;
                    // 如果是玩家圖片，還要幫他去背
                    processBackgroundRemoval(file); 
                    // 執行比對
                    compareFaces();
                }
            } else {
                statusEl.innerText = "No Face Found ❌";
                statusEl.style.color = "#ff5252";
                if (type === 'player') processBackgroundRemoval(file); // 即使沒偵測到臉也讓他玩，只是不能識別
            }
        }

        async function processBackgroundRemoval(file) {
            // 去背邏輯
            document.getElementById('start-btn').style.display = 'none'; // 暫時隱藏開始按鈕
            try {
                const config = { publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.3.0/dist/" };
                const blob = await imglyRemoveBackground(file, config);
                els.img.src = URL.createObjectURL(blob);
            } catch (err) {
                els.img.src = URL.createObjectURL(file); // 失敗用原圖
            }
            document.getElementById('start-btn').style.display = 'flex';
        }

        // --- 3. 核心比對邏輯 (Magic Happens Here) ---
        function compareFaces() {
            if (!state.targetDescriptor || !state.playerDescriptor) {
                state.isTeacher = false;
                return;
            }

            // 計算歐幾里得距離 (數值越小越像，通常 < 0.6 視為同一人)
            const distance = faceapi.euclideanDistance(state.targetDescriptor, state.playerDescriptor);
            console.log("Face Distance:", distance);

            // 判斷閾值 (0.5 比較嚴格，0.6 比較寬鬆)
            if (distance < 0.55) {
                state.isTeacher = true;
                els.matchIndicator.style.display = 'block';
                els.matchIndicator.innerText = "⚠ 身份確認：目標人物 (MATCH) ⚠";
            } else {
                state.isTeacher = false;
                els.matchIndicator.style.display = 'block';
                els.matchIndicator.style.color = "#aaa";
                els.matchIndicator.style.animation = "none";
                els.matchIndicator.innerText = "身份確認：普通玩家 (NO MATCH)";
            }
        }

        // --- 4. 遊戲開始 ---
        function startGame() {
            state.playerName = document.getElementById('player-name').value.trim() || "同學";
            document.getElementById('setup-layer').style.display = 'none';

            // 根據識別結果初始化場景
            if (state.isTeacher) {
                initTeacherMode();
            } else {
                initNormalMode();
            }

            // 啟動掃描動畫
            const scan = document.getElementById('scan-line');
            scan.style.animation = "scan 2s ease-in-out";

            setInterval(gameLoop, 2000);
        }

        function initTeacherMode() {
            els.wrapper.className = 'scene-teacher';
            document.getElementById('mode-badge').innerText = "⚠ CLASSROOM MODE";
            document.getElementById('mode-badge').style.background = "#b71c1c";
            
            // 隨機開場
            const intros = [
                "Class is starting.", 
                "Put your electronic devices away.", 
                `I see you, ${state.playerName}.`
            ];
            talk(intros[Math.floor(Math.random()*intros.length)]);
        }

        function initNormalMode() {
            els.wrapper.className = 'scene-normal';
            document.getElementById('mode-badge').innerText = "NORMAL MODE";
            talk(`嗨 ${state.playerName}！一起玩吧！`);
        }

        // --- 5. 遊戲循環與動作 ---
        function gameLoop() {
            if (state.isSleeping) {
                state.energy = Math.min(100, state.energy + 5);
                state.hunger = Math.max(0, state.hunger - 1);
            } else {
                state.hunger = Math.max(0, state.hunger - 2);
                state.clean = Math.max(0, state.clean - 1.5);
                state.energy = Math.max(0, state.energy - 1);
                state.fun = Math.max(0, state.fun - 2);
            }
            
            // 老師模式的隨機事件
            if(state.isTeacher && Math.random() < 0.1 && !state.isSleeping) {
                const phrases = [
                    "Folks.", 
                    "Ladies...", 
                    `I need to see ${state.playerName} after class.`,
                    "Is that gum?"
                ];
                talk(phrases[Math.floor(Math.random() * phrases.length)]);
            }

            updateUI();
        }

        function updateUI() {
            els.bars.hunger.style.width = state.hunger + '%';
            els.bars.clean.style.width = state.clean + '%';
            els.bars.energy.style.width = state.energy + '%';
            els.bars.fun.style.width = state.fun + '%';
        }

        // --- 互動功能 (根據身分變化) ---

        function actionFeed() {
            if (state.isTeacher) {
                talk("No eating in my class.");
                animPet('translateX(5px)'); // 搖頭拒絕
            } else {
                talk("好香喔～謝謝！");
                state.hunger = Math.min(100, state.hunger + 20);
                animPet('scale(1.1)');
            }
        }

        function actionClean() {
            if (state.isTeacher) {
                talk("Line up properly.");
                state.clean += 10;
            } else {
                talk("洗澡澡～");
                state.clean = Math.min(100, state.clean + 20);
            }
        }

        function actionPlay() {
            // 關鍵功能：手機
            if (state.isTeacher) {
                talk("Put your electronic devices in your backpack!", true); // true = angry
                state.fun -= 10; // 心情變差
                animPet('scale(1.2)'); // 突然變大(生氣)
            } else {
                talk("耶！玩遊戲！");
                state.fun = Math.min(100, state.fun + 20);
                animPet('translateY(-20px)');
            }
        }

        function actionSleep() {
            state.isSleeping = !state.isSleeping;
            if (state.isSleeping) {
                els.wrapper.classList.add('dark-mode');
                if(state.isTeacher) {
                    talk("Class dismiss.");
                } else {
                    talk("晚安...");
                }
            } else {
                els.wrapper.classList.remove('dark-mode');
                talk(state.isTeacher ? "Morning folks." : "早安！");
            }
        }

        function talk(text, isAngry = false) {
            els.bubble.innerText = text;
            els.bubble.className = isAngry ? 'angry' : '';
            els.bubble.style.transform = "translateX(-50%) scale(1)";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                // 老師模式講英文，普通模式講中文
                u.lang = /[a-zA-Z]/.test(text) ? 'en-US' : 'zh-HK';
                if(state.isTeacher) {
                    u.pitch = 0.8; // 老師聲音低沉一點
                    u.rate = 1.1;
                } else {
                    u.pitch = 1.2; // 寵物聲音高一點
                }
                window.speechSynthesis.speak(u);
            }

            setTimeout(() => {
                els.bubble.style.transform = "translateX(-50%) scale(0)";
            }, 3000);
        }

        function animPet(trans) {
            const original = els.img.style.transform;
            els.img.style.transform = trans;
            setTimeout(() => els.img.style.transform = original, 300);
        }

    </script>
</body>
</html>
