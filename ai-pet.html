<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNIFER STATUS & TOOLS</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/imgly-background-removal.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00f3ff; --danger: #ff003c; --bar-bg: rgba(0,0,0,0.6); }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; user-select: none; touch-action: none; }

        /* 場景 (CSS生成) */
        #stage { position: fixed; inset: 0; transition: 0.5s; z-index: 0; }
        .bg-livingroom { background: linear-gradient(to bottom, #ffeebb 0%, #c19a6b 100%); }
        .bg-park { background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 100%); }
        .bg-class { background: linear-gradient(to bottom, #2F4F4F 0%, #3e2723 100%); box-shadow: inset 0 0 100px black; }

        /* 狀態列 (Status Bars) */
        #status-panel {
            position: absolute; top: 15px; left: 15px; width: 140px;
            display: flex; flex-direction: column; gap: 8px; z-index: 20;
            pointer-events: none;
        }
        .bar-box {
            background: var(--bar-bg); border-radius: 10px; padding: 4px 8px;
            display: flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.3);
        }
        .icon { font-size: 14px; width: 20px; text-align: center; }
        .progress-track { flex: 1; height: 8px; background: #333; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; transition: width 0.3s, background 0.3s; }
        /* 顏色定義 */
        .fill-hunger { background: #ffaa00; }
        .fill-clean { background: #00ccff; }
        .fill-energy { background: #cc00ff; }

        /* 角色 */
        #pet-container {
            position: absolute; width: 260px; height: 260px;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            touch-action: none; cursor: grab; z-index: 10;
        }
        #pet-img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.5); pointer-events: none;
            transition: transform 0.2s; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }
        .dirty { filter: sepia(0.8) brightness(0.8) !important; border-color: #5d4037 !important; }

        /* 道具 (Tool) - 漂浮層 */
        #active-tool {
            position: absolute; font-size: 80px; pointer-events: none; z-index: 100;
            display: none; transform: translate(-50%, -50%); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        /* 屎與蒼蠅 */
        .poop { position: absolute; font-size: 40px; animation: bounce 1s infinite alternate; z-index: 5; pointer-events: none; }
        .fly { position: absolute; font-size: 20px; animation: fly 0.5s infinite linear; z-index: 15; pointer-events: none; }
        @keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-10px);} }
        @keyframes fly { 0%{transform:translate(0,0)} 25%{transform:translate(5px,-5px)} 50%{transform:translate(0,-10px)} 75%{transform:translate(-5px,-5px)} 100%{transform:translate(0,0)} }

        /* 底部按鈕 */
        .dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(255,255,255,0.2); padding: 15px; border-radius: 50px;
            backdrop-filter: blur(10px); z-index: 20; border: 1px solid rgba(255,255,255,0.3);
        }
        .dock-btn {
            width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 26px;
            cursor: pointer; background: rgba(255,255,255,0.9); transition: 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        .dock-btn:active { transform: scale(0.9); }

        /* 氣泡 */
        #bubble {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%) scale(0);
            background: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; white-space: nowrap;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); pointer-events: none; transition: 0.2s;
        }

        /* 設定頁 */
        #setup { position: fixed; inset: 0; background: #222; z-index: 999; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .setup-card { background: #333; padding: 20px; border-radius: 15px; width: 100%; max-width: 320px; margin-bottom: 15px; color: white; text-align: center; }
        input[type="text"] { width: 90%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="color:white; font-family:'Fredoka'">PET STATUS v12.0</h1>
        
        <div class="setup-card" onclick="document.getElementById('file').click()" style="cursor:pointer; border:2px dashed #666">
            <img id="prev-img" style="width:100px; height:100px; border-radius:50%; object-fit:cover; display:none; margin:0 auto;">
            <div id="cam-txt" style="font-size:40px">📷</div>
            <div style="font-size:12px; color:#aaa; margin-top:5px;">上傳照片</div>
        </div>
        <input type="file" id="file" hidden accept="image/*">

        <div class="setup-card">
            <label>Name</label>
            <input type="text" id="p-name" value="Tom" placeholder="Student Name">
        </div>

        <div class="setup-card" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <strong style="color:var(--danger)">JENNIFER MODE</strong>
                <div style="font-size:10px; color:#aaa">Teacher / Strict / Angry</div>
            </div>
            <input type="checkbox" id="mode-sw" style="width:20px; height:20px">
        </div>

        <button onclick="startGame()" style="width:200px; padding:15px; border-radius:30px; border:none; background:var(--primary); font-weight:bold; font-size:18px; cursor:pointer;">START GAME</button>
    </div>

    <div id="stage" class="bg-livingroom">
        
        <div id="status-panel">
            <div class="bar-box">
                <span class="icon">🍔</span>
                <div class="progress-track"><div id="bar-hunger" class="progress-fill fill-hunger" style="width:100%"></div></div>
            </div>
            <div class="bar-box">
                <span class="icon">🧼</span>
                <div class="progress-track"><div id="bar-clean" class="progress-fill fill-clean" style="width:100%"></div></div>
            </div>
            <div class="bar-box">
                <span class="icon">⚡</span>
                <div class="progress-track"><div id="bar-energy" class="progress-fill fill-energy" style="width:100%"></div></div>
            </div>
            <button onclick="changeScene()" style="margin-top:5px; background:rgba(255,255,255,0.3); border:none; color:white; border-radius:5px; font-size:10px; padding:5px;">🏞️ CHANGE SCENE</button>
        </div>

        <div id="pet-container">
            <div id="bubble"></div>
            <div id="flies-zone"></div>
            <img id="pet-img">
        </div>

        <div id="active-tool">🍔</div>

        <div class="dock">
            <button class="dock-btn" onmousedown="spawnTool('food')" ontouchstart="spawnTool('food')">🍔</button>
            <button class="dock-btn" onmousedown="spawnTool('soap')" ontouchstart="spawnTool('soap')">🧼</button>
            <button class="dock-btn" onmousedown="spawnTool('bed')" ontouchstart="spawnTool('bed')">🛏️</button>
            <button class="dock-btn" onmousedown="spawnTool('phone')" ontouchstart="spawnTool('phone')" style="background:#fff9c4">📱</button>
        </div>
    </div>

    <script>
        // --- 變數 ---
        let isJennifer = false;
        let playerName = "Tom";
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 數值 (0-100)
        let stats = { hunger: 80, clean: 80, energy: 80 };
        let poopCount = 0;
        
        // 道具拖曳變數
        let currentTool = null; // 'food', 'soap', 'bed', 'phone'
        let isToolDragging = false;
        let toolEl = document.getElementById('active-tool');

        // 場景
        const scenes = ['bg-livingroom', 'bg-park', 'bg-class'];
        let sceneIdx = 0;

        // --- 1. 初始化 ---
        document.getElementById('file').addEventListener('change', async (e) => {
            const f = e.target.files[0];
            if(!f) return;
            const url = URL.createObjectURL(f);
            document.getElementById('prev-img').src = url;
            document.getElementById('prev-img').style.display = 'block';
            document.getElementById('cam-txt').style.display = 'none';
            
            try {
                const blob = await imglyRemoveBackground(f, {publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.3.0/dist/"});
                document.getElementById('pet-img').src = URL.createObjectURL(blob);
            } catch(err) {
                document.getElementById('pet-img').src = url;
            }
        });

        function startGame() {
            playerName = document.getElementById('p-name').value || "Student";
            isJennifer = document.getElementById('mode-sw').checked;
            document.getElementById('setup').style.display = 'none';
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            if(isJennifer) {
                document.getElementById('stage').className = 'bg-class';
                speak("Class begins. Sit down.");
            } else {
                speak("Let's play!");
            }
            
            // 啟動循環
            gameLoop();
            physicsLoop();
            
            // 全局滑鼠/觸控監聽 (用於道具拖曳)
            window.addEventListener('mousemove', onToolMove);
            window.addEventListener('touchmove', onToolMove, {passive:false});
            window.addEventListener('mouseup', onToolRelease);
            window.addEventListener('touchend', onToolRelease);
        }

        // --- 2. 遊戲循環 (數值與狀態) ---
        function gameLoop() {
            setInterval(() => {
                // 1. 自然消耗
                stats.hunger = Math.max(0, stats.hunger - 1);
                stats.clean = Math.max(0, stats.clean - 0.5);
                stats.energy = Math.max(0, stats.energy - 0.8);

                // 2. 拉屎邏輯 (如果飽足感高，機率拉屎)
                if(stats.hunger > 50 && Math.random() < 0.05) {
                    spawnPoop();
                }

                // 3. 骯髒懲罰 (屎多扣清潔)
                if(poopCount > 0) stats.clean = Math.max(0, stats.clean - (poopCount * 2));

                // 4. 更新UI
                updateBars();

                // 5. 骯髒視覺
                const img = document.getElementById('pet-img');
                const flies = document.getElementById('flies-zone');
                if(stats.clean < 40) {
                    img.classList.add('dirty');
                    if(flies.childElementCount === 0) {
                        flies.innerHTML = '<div class="fly" style="top:-20px; left:10px">🪰</div><div class="fly" style="top:20px; left:-20px; animation-delay:0.5s">🪰</div>';
                    }
                } else {
                    img.classList.remove('dirty');
                    flies.innerHTML = '';
                }

            }, 2000); // 每2秒扣一次
        }

        function updateBars() {
            setBar('bar-hunger', stats.hunger);
            setBar('bar-clean', stats.clean);
            setBar('bar-energy', stats.energy);
        }
        function setBar(id, val) {
            const el = document.getElementById(id);
            el.style.width = val + '%';
            if(val < 30) el.style.background = '#ff003c'; // 危險紅
            else if(id === 'bar-hunger') el.style.background = '#ffaa00';
            else if(id === 'bar-clean') el.style.background = '#00ccff';
            else el.style.background = '#cc00ff';
        }

        // --- 3. 道具系統 (核心互動) ---
        
        // 按下按鈕生成道具
        function spawnTool(type, e) {
            if(e) e.preventDefault();
            currentTool = type;
            isToolDragging = true;
            
            // 設定圖標
            const icons = { food: '🍔', soap: '🧼', bed: '🛏️', phone: '📱' };
            toolEl.innerText = icons[type];
            toolEl.style.display = 'block';
            
            // 播放音效
            playSound('pop');
        }

        // 拖曳道具
        function onToolMove(e) {
            if(!isToolDragging) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            
            toolEl.style.left = cx + 'px';
            toolEl.style.top = cy + 'px';
        }

        // 放開道具 (判定互動)
        function onToolRelease(e) {
            if(!isToolDragging) return;
            isToolDragging = false;
            toolEl.style.display = 'none';

            // 取得手指/滑鼠最後位置
            const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

            // 檢查是否碰到寵物 (簡單距離判定)
            const petRect = document.getElementById('pet-container').getBoundingClientRect();
            const petCx = petRect.left + petRect.width/2;
            const petCy = petRect.top + petRect.height/2;
            const dist = Math.hypot(cx - petCx, cy - petCy);

            if(dist < 100) {
                // 碰到寵物，執行效果
                applyToolEffect(currentTool);
            } else {
                // 沒碰到，掉落無效
            }
            currentTool = null;
        }

        function applyToolEffect(type) {
            if(isJennifer) {
                // --- Jennifer 模式反應 ---
                if(type === 'food') {
                    speak("No eating in class!");
                    playSound('bad');
                    // 不增加數值，甚至可能扣分
                } else if(type === 'soap') {
                    speak("Finally, fix your hygiene.");
                    stats.clean = 100;
                    clearPoop();
                    playSound('clean');
                } else if(type === 'bed') {
                    speak("NO SLEEPING! Wake up!");
                    playSound('bad');
                    shakeScreen();
                } else if(type === 'phone') {
                    speak("GIVE ME THAT! Confiscated.");
                    playSound('bad');
                    shakeScreen();
                }
            } else {
                // --- 普通模式反應 ---
                if(type === 'food') {
                    stats.hunger = Math.min(100, stats.hunger + 30);
                    speak("Yummy!");
                    playSound('eat');
                    // 變大動畫
                    animPet('scale(1.3)');
                } else if(type === 'soap') {
                    stats.clean = 100;
                    clearPoop();
                    speak("So fresh!");
                    playSound('clean');
                    animPet('rotate(360deg)');
                } else if(type === 'bed') {
                    stats.energy = 100;
                    speak("Good night zzz");
                    document.getElementById('stage').style.filter = "brightness(0.2)";
                    setTimeout(()=>document.getElementById('stage').style.filter="none", 2000);
                } else if(type === 'phone') {
                    speak("Let's play games!");
                    playSound('pop');
                }
            }
            updateBars();
        }

        // --- 4. 屎尿系統 ---
        function spawnPoop() {
            const p = document.createElement('div');
            p.innerText = "💩"; p.className = 'poop';
            p.style.left = (Math.random()*(window.innerWidth-50))+'px';
            p.style.top = (window.innerHeight - 100 - Math.random()*50)+'px';
            document.body.appendChild(p);
            poopCount++;
            playSound('fart');
            if(isJennifer && poopCount===1) speak("What is that smell?");
        }
        function clearPoop() {
            document.querySelectorAll('.poop').forEach(e => e.remove());
            poopCount = 0;
        }

        // --- 5. 輔助功能 ---
        function changeScene() {
            if(isJennifer) { speak("Sit down."); return; }
            sceneIdx = (sceneIdx+1) % scenes.length;
            document.getElementById('stage').className = scenes[sceneIdx];
        }

        function speak(text) {
            const b = document.getElementById('bubble');
            b.innerText = text;
            b.style.transform = "translateX(-50%) scale(1)";
            b.style.color = isJennifer ? "red" : "black";
            
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = isJennifer ? 'en-US' : 'zh-HK';
            u.rate = 1.1;
            window.speechSynthesis.speak(u);
            setTimeout(()=>b.style.transform="translateX(-50%) scale(0)", 2000);
        }

        function playSound(t) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if(t==='pop') {
                osc.frequency.setValueAtTime(600,now); osc.frequency.exponentialRampToValueAtTime(1000,now+0.1);
            } else if(t==='eat') {
                osc.type='triangle'; osc.frequency.setValueAtTime(300,now); osc.frequency.linearRampToValueAtTime(200,now+0.1);
            } else if(t==='clean') {
                osc.type='sine'; osc.frequency.setValueAtTime(800,now); osc.frequency.exponentialRampToValueAtTime(1200,now+0.3);
            } else if(t==='bad') {
                osc.type='sawtooth'; osc.frequency.setValueAtTime(100,now);
            } else if(t==='fart') {
                osc.type='sawtooth'; osc.frequency.setValueAtTime(150,now); osc.frequency.linearRampToValueAtTime(50,now+0.4);
            }
            g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0,now+(t==='fart'?0.4:0.1));
            osc.start(now); osc.stop(now+(t==='fart'?0.4:0.1));
        }

        function animPet(trans) {
            const i = document.getElementById('pet-img');
            i.style.transform = trans;
            setTimeout(()=>i.style.transform='none', 500);
        }
        function shakeScreen() {
            document.body.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
            setTimeout(()=>document.body.style.transform='none', 200);
        }

        // --- 物理拖曳角色 (與道具分開) ---
        const petC = document.getElementById('pet-container');
        let px=window.innerWidth/2, py=window.innerHeight/2;
        let vpx=0, vpy=0, draggingPet=false, lastPx, lastPy;

        petC.addEventListener('mousedown', (e)=>{ if(!isToolDragging) { draggingPet=true; vpx=0; vpy=0; lastPx=e.clientX; lastPy=e.clientY; } });
        petC.addEventListener('touchstart', (e)=>{ if(!isToolDragging) { draggingPet=true; vpx=0; vpy=0; lastPx=e.touches[0].clientX; lastPy=e.touches[0].clientY; } }, {passive:false});

        window.addEventListener('mousemove', (e)=>{
            if(draggingPet) {
                e.preventDefault();
                let cx = e.clientX, cy = e.clientY;
                px += cx-lastPx; py += cy-lastPy;
                vpx = (cx-lastPx)*1.5; vpy = (cy-lastPy)*1.5;
                lastPx=cx; lastPy=cy;
                petC.style.left=px+'px'; petC.style.top=py+'px';
            }
        });
        window.addEventListener('touchmove', (e)=>{
            if(draggingPet) {
                e.preventDefault();
                let cx = e.touches[0].clientX, cy = e.touches[0].clientY;
                px += cx-lastPx; py += cy-lastPy;
                vpx = (cx-lastPx)*1.5; vpy = (cy-lastPy)*1.5;
                lastPx=cx; lastPy=cy;
                petC.style.left=px+'px'; petC.style.top=py+'px';
            }
        }, {passive:false});

        window.addEventListener('mouseup', ()=>{ draggingPet=false; });
        window.addEventListener('touchend', ()=>{ draggingPet=false; });

        function physicsLoop() {
            if(!draggingPet) {
                let cx = window.innerWidth/2, cy = window.innerHeight/2;
                vpx += (cx-px)*0.05; vpy += (cy-py)*0.05;
                vpx *= 0.9; vpy *= 0.9;
                px+=vpx; py+=vpy;
                petC.style.left=px+'px'; petC.style.top=py+'px';
                document.getElementById('pet-img').style.transform = `rotate(${vpx}deg)`;
            }
            requestAnimationFrame(physicsLoop);
        }
    </script>
</body>
</html>
