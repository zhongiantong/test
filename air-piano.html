<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隔空鋼琴 - 區域鎖定版</title>
    <style>
        body {
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
        }

        h2 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 5px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            object-fit: cover;
            opacity: 0.6;
        }

        /* 琴鍵區域 */
        .keys-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px; /* 稍微變矮一點 */
            display: flex;
            z-index: 10;
        }

        .key {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.1s;
        }

        .key.active {
            background: rgba(0, 210, 255, 0.6);
            box-shadow: 0 0 30px #00d2ff;
            transform: scale(1.1);
        }

        /* 觸發線 (視覺輔助) */
        .trigger-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 2px;
            background: red;
            opacity: 0.5;
            z-index: 5;
        }
        .trigger-text {
            position: absolute;
            bottom: 105px;
            right: 10px;
            color: red;
            font-size: 12px;
            opacity: 0.8;
        }

        button.start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>🎹 隔空鋼琴</h2>
    <p>請將手放在紅線下方操作，頭部請保持在紅線上方</p>

    <div class="container">
        <video id="video" playsinline></video>
        <div class="trigger-line"></div>
        <div class="trigger-text">偵測界線</div>
        <div class="keys-container" id="keys"></div>
    </div>
    <canvas id="canvas"></canvas>

    <button class="start-btn" onclick="init()">🔴 啟動鏡頭</button>
    <br>
    <a href="index.html" style="color:white; text-decoration:none;">⬅ 回到首頁</a>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const keysContainer = document.getElementById('keys');
        
        const notes = [
            { name: 'Do', freq: 261.63, color: '#ff595e' },
            { name: 'Re', freq: 293.66, color: '#ffca3a' },
            { name: 'Mi', freq: 329.63, color: '#8ac926' },
            { name: 'Fa', freq: 349.23, color: '#1982c4' },
            { name: 'Sol', freq: 392.00, color: '#6a4c93' }
        ];

        let audioCtx;
        let prevFrame = null;
        let isRunning = false;

        notes.forEach((note, index) => {
            const div = document.createElement('div');
            div.className = 'key';
            div.id = `key-${index}`;
            div.innerText = note.name;
            div.style.borderColor = note.color;
            keysContainer.appendChild(div);
        });

        async function init() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = 320; // 降低解析度讓偵測更靈敏且快速
                    canvas.height = 240;
                    document.querySelector('.start-btn').style.display = 'none';
                    isRunning = true;
                    detectLoop();
                });
            } catch (e) {
                alert("無法開啟鏡頭");
            }
        }

        function playTone(index) {
            const key = document.getElementById(`key-${index}`);
            if (key.classList.contains('active')) return;

            key.classList.add('active');
            key.style.backgroundColor = notes[index].color;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = notes[index].freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            setTimeout(() => {
                osc.stop();
                key.classList.remove('active');
                key.style.backgroundColor = 'rgba(255,255,255,0.1)';
            }, 200);
        }

        function detectLoop() {
            if (!isRunning) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (prevFrame) {
                const keyWidth = canvas.width / notes.length;
                // 重點修正：只偵測底部 15% 的高度
                // 這樣頭部在上方完全不會影響
                const scanHeight = canvas.height * 0.15; 
                const startY = canvas.height - scanHeight;

                for (let i = 0; i < notes.length; i++) {
                    let movement = 0;
                    const startX = i * keyWidth;
                    
                    // 掃描像素
                    for (let y = startY; y < canvas.height; y += 5) {
                        for (let x = startX; x < startX + keyWidth; x += 5) {
                            const pos = (y * canvas.width + x) * 4;
                            // 增加判定門檻 diff > 40 (原本是20)
                            // 避免雜訊
                            const diff = Math.abs(currentFrame.data[pos+1] - prevFrame.data[pos+1]); 
                            if (diff > 40) movement++;
                        }
                    }

                    // 觸發門檻
                    if (movement > 5) {
                        playTone(notes.length - 1 - i);
                    }
                }
            }
            prevFrame = currentFrame;
            requestAnimationFrame(detectLoop);
        }
    </script>
</body>
</html>
