<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隔空鋼琴</title>
    <style>
        body {
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
        }

        h2 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 5px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            object-fit: cover;
            opacity: 0.6; /* 讓影片稍微暗一點，凸顯琴鍵 */
        }

        /* 琴鍵區域 */
        .keys-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
        }

        .key {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.1s;
        }

        /* 觸發時的樣式 */
        .key.active {
            background: rgba(0, 210, 255, 0.6);
            box-shadow: 0 0 30px #00d2ff;
            transform: scale(1.1);
        }

        button.start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        canvas { display: none; } /* 隱藏運算用的畫布 */
    </style>
</head>
<body>

    <h2>🎹 隔空鋼琴</h2>
    <p>允許鏡頭後，用手觸摸下方的虛擬琴鍵</p>

    <div class="container">
        <video id="video" playsinline></video>
        <div class="keys-container" id="keys">
            </div>
    </div>
    <canvas id="canvas"></canvas>

    <button class="start-btn" onclick="init()">🔴 啟動鏡頭</button>
    <br>
    <a href="index.html" style="color:white; text-decoration:none;">⬅ 回到首頁</a>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const keysContainer = document.getElementById('keys');
        
        // 音階設定 (簡單的頻率)
        const notes = [
            { name: 'Do', freq: 261.63, color: '#ff595e' },
            { name: 'Re', freq: 293.66, color: '#ffca3a' },
            { name: 'Mi', freq: 329.63, color: '#8ac926' },
            { name: 'Fa', freq: 349.23, color: '#1982c4' },
            { name: 'Sol', freq: 392.00, color: '#6a4c93' }
        ];

        let audioCtx;
        let prevFrame = null;
        let isRunning = false;

        // 產生琴鍵 HTML
        notes.forEach((note, index) => {
            const div = document.createElement('div');
            div.className = 'key';
            div.id = `key-${index}`;
            div.innerText = note.name;
            div.style.borderColor = note.color;
            keysContainer.appendChild(div);
        });

        async function init() {
            // 初始化音效
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.play();
                
                // 設定畫布大小與影片相同
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = 640; // 降低解析度以提升效能
                    canvas.height = 480;
                    document.querySelector('.start-btn').style.display = 'none';
                    isRunning = true;
                    detectLoop();
                });
            } catch (e) {
                alert("無法開啟鏡頭: " + e);
            }
        }

        function playTone(index) {
            const key = document.getElementById(`key-${index}`);
            if (key.classList.contains('active')) return; // 避免重複觸發

            // 視覺效果
            key.classList.add('active');
            key.style.backgroundColor = notes[index].color;
            
            // 聲音效果
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = notes[index].freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            setTimeout(() => {
                osc.stop();
                key.classList.remove('active');
                key.style.backgroundColor = 'rgba(255,255,255,0.1)';
            }, 200);
        }

        function detectLoop() {
            if (!isRunning) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (prevFrame) {
                // 檢查每個琴鍵區域是否有動作
                const keyWidth = canvas.width / notes.length;
                const keyHeight = canvas.height * 0.25; // 底部 1/4 區域
                const startY = canvas.height - keyHeight;

                for (let i = 0; i < notes.length; i++) {
                    let movement = 0;
                    const startX = i * keyWidth;
                    
                    // 抽樣檢查該區域像素
                    for (let y = startY; y < canvas.height; y += 10) {
                        for (let x = startX; x < startX + keyWidth; x += 10) {
                            const pos = (y * canvas.width + x) * 4;
                            const diff = Math.abs(currentFrame.data[pos+1] - prevFrame.data[pos+1]); // 只比對綠色通道省效能
                            if (diff > 20) movement++;
                        }
                    }

                    // 如果動作量超過閾值，觸發琴鍵
                    if (movement > 10) {
                        playTone(notes.length - 1 - i); // 因為鏡像，順序要反過來
                    }
                }
            }

            prevFrame = currentFrame;
            requestAnimationFrame(detectLoop);
        }
    </script>
</body>
</html>
