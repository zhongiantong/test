<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 包剪揼 - 鏡頭對戰</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose/dist/fingerpose.js"></script>

    <style>
        body {
            margin: 0;
            background: #1e1e2e;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 { margin-top: 20px; color: #ff00d4; text-shadow: 0 0 10px #ff00d4; }

        .game-area {
            position: relative;
            margin-top: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 玩家鏡頭區 */
        .camera-box {
            position: relative;
            width: 480px;
            height: 360px;
            border: 4px solid #00d2ff;
            border-radius: 10px;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: scaleX(-1); /* 鏡像翻轉 */
        }

        /* 電腦對手區 */
        .cpu-box {
            width: 300px;
            height: 360px;
            background: #2d2d44;
            border: 4px solid #ff4444;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .cpu-emoji { font-size: 100px; transition: transform 0.2s; }
        .cpu-text { font-size: 24px; color: #aaa; margin-top: 10px; }

        /* 中間的 VS 和結果 */
        .status-panel {
            text-align: center;
            width: 100%;
            height: 80px;
            margin-top: 10px;
        }
        #result-text {
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        /* 你的手勢預覽 */
        #gesture-preview {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 20px;
            color: #00ff00;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #00d2ff, #0077ff);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px #00d2ff;
        }
        button:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        #loading {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            z-index: 99;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #00d2ff; font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div>🖐 正在載入 AI 手勢模型...</div>
        <div style="font-size:16px; color:#aaa; margin-top:10px;">(初次載入約需 5-10 秒)</div>
    </div>

    <h2>✊ ✋ ✌ 鏡頭猜拳大戰</h2>

    <div class="status-panel">
        <div id="result-text">準備開始...</div>
    </div>

    <div class="game-area">
        <div class="camera-box">
            <video id="video" playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="gesture-preview">偵測中...</div>
        </div>

        <div class="cpu-box">
            <div class="cpu-emoji" id="cpu-emoji">🤖</div>
            <div class="cpu-text">電腦</div>
        </div>
    </div>

    <button id="play-btn" onclick="startCountdown()" disabled>開始猜拳</button>
    <br>
    <a href="index.html" style="color:white; text-decoration:none; margin-top:20px;">⬅ 回到首頁</a>

    <script>
        let model = null;
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let playBtn = document.getElementById('play-btn');
        let gesturePreview = document.getElementById('gesture-preview');
        let resultText = document.getElementById('result-text');
        let cpuEmoji = document.getElementById('cpu-emoji');
        
        let currentGesture = null; // 當前偵測到的手勢
        let isDetecting = false;
        
        // 定義手勢名稱對應
        const GESTURE_MAP = {
            'rock': { icon: '✊', name: '包 (石頭)' },
            'paper': { icon: '✋', name: '布 (紙)' },
            'scissors': { icon: '✌', name: '剪 (剪刀)' }
        };

        // 1. 初始化並載入模型
        async function init() {
            try {
                // 啟動鏡頭
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();

                // 載入 Handpose 模型
                model = await handpose.load();
                console.log("Model Loaded");

                // 設定 Fingerpose (定義什麼是石頭、什麼是布)
                setupFingerPose();

                // 關閉載入畫面
                document.getElementById('loading').style.display = 'none';
                playBtn.disabled = false;
                playBtn.innerText = "出拳！";
                
                // 設定畫布尺寸
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // 開始持續偵測 (為了即時預覽)
                detectLoop();

            } catch (err) {
                alert("錯誤：無法啟動鏡頭或載入模型 " + err);
            }
        }

        // 2. 設定手勢定義 (Fingerpose 核心)
        let gestureEstimator;
        function setupFingerPose() {
            // 定義「石頭」 (所有手指都彎曲)
            const rock = new fp.GestureDescription('rock');
            for(let finger of [fp.Finger.Thumb, fp.Finger.Index, fp.Finger.Middle, fp.Finger.Ring, fp.Finger.Pinky]) {
                rock.addCurl(finger, fp.FingerCurl.FullCurl, 1.0);
                rock.addCurl(finger, fp.FingerCurl.HalfCurl, 0.9);
            }

            // 定義「布」 (所有手指都沒彎曲)
            const paper = new fp.GestureDescription('paper');
            for(let finger of [fp.Finger.Thumb, fp.Finger.Index, fp.Finger.Middle, fp.Finger.Ring, fp.Finger.Pinky]) {
                paper.addCurl(finger, fp.FingerCurl.NoCurl, 1.0);
            }

            // 定義「剪刀」 (食指中指伸直，其他彎曲)
            const scissors = new fp.GestureDescription('scissors');
            scissors.addCurl(fp.Finger.Index, fp.FingerCurl.NoCurl, 1.0);
            scissors.addCurl(fp.Finger.Middle, fp.FingerCurl.NoCurl, 1.0);
            scissors.addCurl(fp.Finger.Ring, fp.FingerCurl.FullCurl, 1.0);
            scissors.addCurl(fp.Finger.Ring, fp.FingerCurl.HalfCurl, 0.9);
            scissors.addCurl(fp.Finger.Pinky, fp.FingerCurl.FullCurl, 1.0);
            scissors.addCurl(fp.Finger.Pinky, fp.FingerCurl.HalfCurl, 0.9);

            // 建立判斷器
            gestureEstimator = new fp.GestureEstimator([rock, paper, scissors]);
        }

        // 3. 偵測迴圈 (即時畫骨架 + 判斷手勢)
        async function detectLoop() {
            // 偵測手
            const predictions = await model.estimateHands(video);

            // 清空畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (predictions.length > 0) {
                // 畫出骨架
                drawHand(predictions[0].landmarks);

                // 判斷手勢
                const est = gestureEstimator.estimate(predictions[0].landmarks, 7.5);
                if (est.gestures.length > 0) {
                    // 找出信心度最高的
                    const best = est.gestures.reduce((p, c) => (p.confidence > c.confidence ? p : c));
                    currentGesture = best.name;
                    gesturePreview.innerText = `目前偵測: ${GESTURE_MAP[best.name].icon}`;
                    gesturePreview.style.color = "#00ff00";
                } else {
                    currentGesture = null;
                    gesturePreview.innerText = "手勢不明";
                    gesturePreview.style.color = "yellow";
                }
            } else {
                currentGesture = null;
                gesturePreview.innerText = "找不到手...";
                gesturePreview.style.color = "red";
            }

            requestAnimationFrame(detectLoop);
        }

        // 畫骨架輔助線
        function drawHand(landmarks) {
            ctx.strokeStyle = "#00d2ff";
            ctx.lineWidth = 2;
            const fingers = [
                [0,1,2,3,4], [0,5,6,7,8], [0,9,10,11,12], 
                [0,13,14,15,16], [0,17,18,19,20]
            ];
            
            // 畫線
            for (let i = 0; i < fingers.length; i++) {
                const points = fingers[i];
                ctx.beginPath();
                ctx.moveTo(landmarks[points[0]][0], landmarks[points[0]][1]);
                for (let j = 1; j < points.length; j++) {
                    ctx.lineTo(landmarks[points[j]][0], landmarks[points[j]][1]);
                }
                ctx.stroke();
            }
            // 畫關節點
            ctx.fillStyle = "red";
            for(let i=0; i<landmarks.length; i++){
                ctx.beginPath();
                ctx.arc(landmarks[i][0], landmarks[i][1], 3, 0, 2*Math.PI);
                ctx.fill();
            }
        }

        // 4. 遊戲邏輯：倒數與判定
        let isCountingDown = false;
        function startCountdown() {
            if (isCountingDown) return;
            isCountingDown = true;
            playBtn.disabled = true;
            resultText.style.color = "white";

            let count = 3;
            cpuEmoji.innerText = "✊"; // 電腦做預備動作

            // 快速切換電腦圖案製造緊張感
            let shuffle = setInterval(() => {
                const icons = ['✊', '✋', '✌'];
                cpuEmoji.innerText = icons[Math.floor(Math.random()*3)];
            }, 100);

            // 倒數計時器
            let timer = setInterval(() => {
                resultText.innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    clearInterval(shuffle);
                    revealWinner();
                }
                count--;
            }, 800);
        }

        function revealWinner() {
            // 1. 電腦出拳
            const choices = ['rock', 'paper', 'scissors'];
            const cpuChoice = choices[Math.floor(Math.random() * 3)];
            cpuEmoji.innerText = GESTURE_MAP[cpuChoice].icon;

            // 2. 玩家出拳 (取當前偵測到的)
            const playerChoice = currentGesture;

            if (!playerChoice) {
                resultText.innerText = "❓ 偵測失敗，請將手放好";
                resultText.style.color = "yellow";
            } else {
                // 3. 判斷勝負
                let msg = "";
                let color = "white";

                if (playerChoice === cpuChoice) {
                    msg = "🤝 平手！";
                    color = "#aaa";
                } else if (
                    (playerChoice === 'rock' && cpuChoice === 'scissors') ||
                    (playerChoice === 'paper' && cpuChoice === 'rock') ||
                    (playerChoice === 'scissors' && cpuChoice === 'paper')
                ) {
                    msg = "🎉 你贏了！";
                    color = "#00ff00";
                } else {
                    msg = "💀 電腦贏了...";
                    color = "#ff4444";
                }

                resultText.innerText = `${GESTURE_MAP[playerChoice].icon} vs ${GESTURE_MAP[cpuChoice].icon} \n ${msg}`;
                resultText.style.color = color;
            }

            // 重置按鈕
            setTimeout(() => {
                isCountingDown = false;
                playBtn.disabled = false;
                playBtn.innerText = "再來一局";
            }, 1000);
        }

        // 啟動
        init();

    </script>
</body>
</html>
